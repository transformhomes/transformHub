<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>AI Projects</title>
<link rel="stylesheet" href="shared.css">
<style>
  .proj { text-align:left; display:block; width:100%; cursor:pointer; }
  .proj:hover { border-color:var(--accent); background:#1a1f27; }
  .proj .name { font-weight:600; font-size:15px; margin-bottom:4px; }
  .proj .path { color:var(--muted); font-size:12px; word-break:break-all; margin-bottom:10px; }
  .back { margin-bottom:14px; }
  .actions { margin:14px 0 6px; }
</style>
</head>
<body>
<div class="page" id="root"></div>

<script src="common.js"></script>
<script>
  let openId = null;      // project shown in the focus view, or null for the list
  let launchMsg = null;   // { ok, text } shown under the launch buttons

  const root = document.getElementById('root');
  const activeCount = (pid) => App.data.tasks.filter((t) => !t.done && t.project === pid).length;

  function renderList() {
    root.replaceChildren(
      h('h1', { text: 'AI Projects' }),
      h('p', { class: 'sub', text: 'Pick one project to work on. Open it to see its tasks and launch Antigravity in its folder.' }));
    if (!App.projects.length) {
      root.append(h('div', { class: 'empty', text: 'No projects yet. Add them under "projects" in the settings file (cog in the left rail).' }));
      return;
    }
    const grid = h('div', { class: 'grid' });
    App.projects.forEach((p) => {
      const n = activeCount(p.id);
      const isFocus = App.data.focusProject === p.id;
      grid.append(h('button', { class: 'card proj', onclick: () => { openId = p.id; launchMsg = null; render(); } },
        h('div', { class: 'name', text: p.name }),
        h('div', { class: 'path', text: p.path }),
        h('div', { class: 'row' },
          isFocus && h('span', { class: 'tag accent', text: 'Focus' }),
          h('span', { class: 'tag', text: n + (n === 1 ? ' open task' : ' open tasks') }))));
    });
    root.append(grid);
  }

  async function launch(kind, id) {
    launchMsg = { ok: true, text: 'Launching…' };
    renderFocus();
    const fn = kind === 'agent' ? window.cc.openAgent : window.cc.openFolder;
    const r = await fn(id);
    launchMsg = r && r.ok
      ? { ok: true, text: kind === 'agent' ? 'Antigravity is opening this folder.' : 'Folder opened.' }
      : { ok: false, text: (r && r.error) || 'Could not open.' };
    renderFocus();
  }

  function renderFocus() {
    const p = App.projects.find((x) => x.id === openId);
    if (!p) { openId = null; renderList(); return; }
    const isFocus = App.data.focusProject === p.id;
    const tasks = sortTasks(App.data.tasks.filter((t) => t.project === p.id));
    const active = tasks.filter((t) => !t.done);
    const done = tasks.filter((t) => t.done);

    // Keep a half-typed task if this page re-draws because something else changed.
    const prevTitle = document.getElementById('pTitle');
    const prevDue = document.getElementById('pDue');
    const keepTitle = prevTitle && prevTitle.dataset.project === p.id ? prevTitle.value : '';
    const keepDue = prevDue && prevDue.dataset.project === p.id ? prevDue.value : '';
    const hadFocus = prevTitle && document.activeElement === prevTitle;

    const input = h('input', { id: 'pTitle', 'data-project': p.id, type: 'text', class: 'grow', maxlength: '500', placeholder: 'Add a task for ' + p.name, 'aria-label': 'New task for ' + p.name, value: keepTitle });
    const due = h('input', { id: 'pDue', 'data-project': p.id, type: 'date', 'aria-label': 'Due date', value: keepDue });
    const form = h('form', { class: 'row', autocomplete: 'off', onsubmit: async (e) => {
      e.preventDefault();
      if (!input.value.trim()) { input.focus(); return; }
      const title = input.value;
      const dueValue = due.value;
      input.value = '';
      due.value = '';
      await addTask(title, p.id, dueValue);
    } }, input, due, h('button', { class: 'primary', type: 'submit', text: 'Add' }));

    root.replaceChildren(
      h('button', { class: 'ghost back', onclick: () => { openId = null; launchMsg = null; render(); } }, '‹ All projects'),
      h('h1', { text: p.name }),
      h('p', { class: 'sub', text: p.path }),
      h('div', { class: 'row actions' },
        h('button', { class: 'primary', onclick: () => launch('agent', p.id) }, 'Open in Antigravity'),
        h('button', { onclick: () => launch('folder', p.id) }, 'Open folder'),
        h('button', { onclick: () => window.cc.openArcane() }, 'Arcane terminals'),
        h('button', {
          class: isFocus ? '' : 'ghost',
          onclick: () => App.save({ focusProject: isFocus ? null : p.id }),
        }, isFocus ? '★ Focus project (click to clear)' : '☆ Make this my focus')),
      launchMsg && h('div', { class: 'msg ' + (launchMsg.ok ? 'ok' : 'err'), text: launchMsg.text }),
      h('h2', { style: 'margin-top:26px', text: 'Tasks for this project' }),
      form,
      active.length ? active.map(taskRow) : h('div', { class: 'empty', text: 'No open tasks.' }),
      done.length > 0 && h('div', { class: 'group-title', text: 'Done (' + done.length + ')' }),
      done.map(taskRow));
    if (hadFocus) input.focus();
  }

  function render() { openId ? renderFocus() : renderList(); }

  App.init(render);
</script>
</body>
</html>
