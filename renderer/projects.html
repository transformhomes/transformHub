<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src data:">
<title>Explorer</title>
<link rel="stylesheet" href="shared.css">
<style>
  .proj { text-align:left; display:block; width:100%; cursor:pointer; }
  .proj:hover { border-color:var(--accent); background:var(--hover); }
  .proj .name { font-weight:600; font-size:15px; margin-bottom:4px; }
  .proj .path { color:var(--muted); font-size:12px; word-break:break-all; margin-bottom:10px; }
  .crumbs { display:flex; flex-wrap:wrap; align-items:center; gap:2px; margin-bottom:12px; color:var(--muted); }
  .crumbs button { padding:3px 8px; }
  .crumbs .here { color:var(--fg); font-weight:600; padding:3px 8px; }
  .actions { margin:12px 0 14px; }
  .files { border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .frow { display:grid; grid-template-columns:var(--cn,minmax(0,1fr)) var(--cm,130px) var(--cs,80px); gap:12px; align-items:center; width:100%; text-align:left;
    background:transparent; border:0; border-bottom:1px solid var(--line); border-radius:0; padding:8px 12px; cursor:pointer; }
  .frow:last-child { border-bottom:0; }
  .frow:hover { background:var(--hover); }
  .frow.head { cursor:default; color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.05em; background:var(--panel); }
  .frow.head:hover { background:var(--panel); }
  .frow.head .hc { position:relative; cursor:pointer; user-select:none; white-space:nowrap; overflow:visible; }
  .frow.head .hc:hover { color:var(--fg); }
  .frow.head .rz { position:absolute; top:-8px; bottom:-8px; right:-10px; width:12px; cursor:col-resize; }
  .frow.head .rz::after { content:''; position:absolute; top:6px; bottom:6px; left:5px; width:1px; background:var(--line); }
  .frow.head .rz:hover::after { background:var(--accent); width:2px; }
  .frow .n { display:flex; align-items:center; gap:10px; min-width:0; }
  .frow .n span.t { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .frow .m { color:var(--muted); font-size:12.5px; }
  .ico { flex:none; width:16px; height:12px; border-radius:3px; border:1.5px solid var(--muted); }
  .ico.dir { border-color:var(--accent); background:var(--accent-bg); }
  pre.preview { margin:12px 0 0; padding:14px 16px; background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:auto; max-height:calc(100vh - 260px);
    font:12.5px/1.55 Consolas, "Cascadia Mono", monospace; white-space:pre-wrap; word-break:break-word; user-select:text; }
  .ctx { position:fixed; z-index:50; min-width:220px; padding:6px; background:var(--card); border:1px solid var(--line-strong); border-radius:10px; box-shadow:0 10px 30px rgba(0,0,0,.35); }
  .ctx button { display:block; width:100%; text-align:left; border:0; background:transparent; border-radius:6px; padding:7px 10px; }
  .ctx button:hover, .ctx button:focus-visible { background:var(--hover); outline:none; }
  .ctx hr { border:0; border-top:1px solid var(--line); margin:5px 2px; }
  .modal { position:fixed; inset:0; z-index:60; display:grid; place-items:center; background:rgba(0,0,0,.45); }
  .modal .box { width:min(480px, calc(100vw - 40px)); }
  .modal dl { display:grid; grid-template-columns:110px 1fr; gap:6px 12px; margin:12px 0 16px; }
  .modal dt { color:var(--muted); }
  .modal dd { margin:0; word-break:break-all; user-select:text; }
  img.preview { max-width:100%; max-height:calc(100vh - 260px); margin-top:12px; border-radius:8px; border:1px solid var(--line); background:var(--well); }
  body { overflow:hidden; }
  .split { display:flex; height:100vh; }
  #tree { width:290px; flex:none; overflow:auto; padding:14px 6px 16px; border-right:1px solid var(--line); background:var(--panel); user-select:none; }
  #root.page { flex:1; min-width:0; max-width:none; height:100%; overflow:auto; box-sizing:border-box; }
  .tn { display:flex; align-items:center; border-radius:6px; }
  .tn:hover { background:var(--hover); }
  .tn.sel { background:var(--accent-bg); }
  .tn button { border:0; background:transparent; cursor:pointer; color:var(--fg); padding:5px 4px; border-radius:6px; }
  .tn .chev { width:22px; flex:none; color:var(--muted); text-align:center; padding:5px 0; }
  .tn .tname { flex:1; min-width:0; text-align:left; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tn.file .tname { color:var(--muted); }
  .tn.root .tname { font-weight:600; }
  .tn.sel .tname { color:var(--fg); }
  .tmsg { color:var(--muted); font-size:12px; padding:4px 8px; }
  .tgrp { margin:12px 8px 4px; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
  .tgrp:first-child { margin-top:0; }
  .tn .star { width:24px; flex:none; text-align:center; color:var(--muted); opacity:0; padding:5px 0; }
  .tn:hover .star, .tn .star:focus-visible, .tn .star.on { opacity:1; }
  .tn .star.on { color:var(--warn); }
  #root.splitting { display:flex; padding:0; overflow:hidden; }
  .pane { flex:1 1 0; min-width:0; height:100%; overflow:auto; padding:22px 24px 40px; box-sizing:border-box; border-top:3px solid transparent; }
  .pane + .pane { border-left:1px solid var(--line); }
  .pane.active { border-top-color:var(--accent); }
  .pane .crumbs { margin-bottom:8px; }
  .paneHead { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .droptarget { outline:2px dashed var(--accent); outline-offset:-2px; background:var(--accent-bg); }
  .frow[draggable="true"] { user-select:none; }
</style>
</head>
<body>
<div class="split">
  <aside id="tree" role="group" aria-label="Folders"></aside>
  <div class="page" id="root"></div>
</div>

<script src="common.js"></script>
<script>
  const root = document.getElementById('root');
  const activeCount = (pid) => App.data.tasks.filter((t) => !t.done && t.project === pid).length;
  let split = false;                       // two folders side by side
  let active = 'a';                        // which pane the folder tree opens folders in
  let paneB = { project: null, path: '', entries: null, error: null };
  let drag = null;                         // the item being dragged inside this page
  function show(...nodes) {
    const list = nodes.flat(Infinity).filter((n) => n != null && n !== false);
    if (!split) { root.classList.remove('splitting'); root.replaceChildren(...list); return; }
    root.classList.add('splitting');
    const a = h('div', { class: 'pane' + (active === 'a' ? ' active' : ''), id: 'paneA', onclick: () => setActive('a') }, ...list);
    makeDropTarget(a, () => (loc.project && view && view.kind === 'dir' ? { root: loc.project, rel: loc.path } : null));
    root.replaceChildren(a, paneBEl());
  }

  let roots = { projects: [], drives: [], favs: [], apps: [] };
  const rootById = (id) => roots.projects.find((x) => x.id === id) || roots.drives.find((x) => x.id === id) || null;
  const isProject = (id) => roots.projects.some((x) => x.id === id);
  const isFav = (id, path) => roots.favs.some((f) => f.root === id && f.rel === path);
  const fullPath = (r, rel) => r.path.replace(/[\\/]+$/, '') + (rel ? '\\' + rel.replace(/\//g, '\\') : (/^[A-Za-z]:[\\/]?$/.test(r.path) ? '\\' : ''));
  let loc = { project: null, path: '' };   // where we are
  let view = null;                        // what loaded for that place
  let note = null;                        // { ok, text } message under the buttons
  let seq = 0;
  let started = false;

  function goTo(project, path) { window.cc.navigate({ section: 'projects', project: project || '', path: path || '' }); }

  function sizeLabel(n) {
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return Math.round(n / 1024) + ' KB';
    return (n / 1024 / 1024).toFixed(1) + ' MB';
  }
  const dateLabel = (ms) => (ms ? new Date(ms).toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' }) : '');
  const join = (a, b) => (a ? a + '/' + b : b);
  const parentOf = (p) => p.split('/').slice(0, -1).join('/');

  async function refreshRoots() { const r = await window.cc.getRoots(); if (r) roots = r; renderTree(); }
  window.addEventListener('focus', () => { if (started) refreshRoots().then(render); }); // picks up apps or favourites changed elsewhere

  // ---- folder tree (left of the folder view) ----
  const expanded = new Set();
  const kids = new Map();      // key -> entries | 'loading' | { error }
  let sel = { project: null, path: '' };
  let collapsing = null;       // the folder just collapsed by clicking its name, so opening it does not re-expand it
  const tkey = (project, rel) => project + '\u0001' + rel;
  const treeEl = document.getElementById('tree');

  function openFromTree(project, rel, isDir) {
    if (split && active === 'b') {
      if (isDir) openPaneB(project, rel); else act(() => window.cc.openFile(project, rel), 'Opened.');
    } else goTo(project, rel);
  }

  function addNode(parent, project, rel, label, isDir, depth) {
    const k = tkey(project, rel);
    const open = expanded.has(k);
    const selected = sel.project === project && sel.path === rel;
    const row = h('div', { class: 'tn' + (selected ? ' sel' : '') + (isDir ? '' : ' file') + (depth === 0 ? ' root' : ''), style: 'padding-left:' + (4 + depth * 14) + 'px' });
    const chev = h('button', { class: 'chev', text: isDir ? (open ? '▾' : '▸') : '' });
    if (isDir) {
      chev.setAttribute('aria-label', (open ? 'Collapse ' : 'Expand ') + label);
      chev.setAttribute('aria-expanded', open ? 'true' : 'false');
      chev.addEventListener('click', () => toggle(project, rel));
    } else { chev.disabled = true; chev.tabIndex = -1; chev.setAttribute('aria-hidden', 'true'); }
    const name = h('button', { class: 'tname', title: label, text: label });
    if (selected) name.setAttribute('aria-current', 'true');
    name.addEventListener('click', () => {
      // Clicking a folder's name opens it and expands it; clicking it again collapses it.
      if (isDir) { if (expanded.has(k)) { collapsing = k; toggle(project, rel); } else toggle(project, rel, true); }
      openFromTree(project, rel, isDir);
    });
    row.append(chev, name);
    if (rel !== '') makeDraggable(row, project, rel, isDir);
    if (isDir) makeDropTarget(row, project, rel);
    row.addEventListener('contextmenu', (e) => {
      e.preventDefault(); e.stopPropagation();
      const p = rootById(project);
      if (p) openMenu(e.clientX, e.clientY, p, rel, isDir);
    });
    if (isDir && rel !== '') {
      const pinned = isFav(project, rel);
      const star = h('button', { class: 'star' + (pinned ? ' on' : ''), title: pinned ? 'Remove from favourites' : 'Add to favourites',
        'aria-label': (pinned ? 'Remove from favourites: ' : 'Add to favourites: ') + label, text: pinned ? '★' : '☆' });
      star.addEventListener('click', async () => {
        const r = await window.cc.toggleFav(project, rel, label);
        if (r && r.ok) { roots.favs = r.favs; renderTree(); render(); }
      });
      row.append(star);
    }
    parent.append(row);
    if (isDir && open) {
      const list = kids.get(k);
      const msg = (t) => parent.append(h('div', { class: 'tmsg', style: 'padding-left:' + (30 + depth * 14) + 'px', text: t }));
      if (list === 'loading' || list === undefined) msg('Loading…');
      else if (!Array.isArray(list)) msg(list.error);
      else if (!list.length) msg('Empty');
      else list.forEach((en) => addNode(parent, project, join(rel, en.name), en.name, en.dir, depth + 1));
    }
  }

  function renderTree() {
    const t = treeEl;
    const keepScroll = t.scrollTop;
    t.replaceChildren(h('div', { class: 'tgrp', text: 'Favourites' }));
    if (!roots.projects.length && !roots.favs.length) t.append(h('div', { class: 'tmsg', text: 'Click the star next to a folder to keep it here.' }));
    roots.projects.forEach((p) => addNode(t, p.id, '', p.name, true, 0));
    roots.favs.forEach((f) => addNode(t, f.root, f.rel, f.name, true, 0));
    t.append(h('div', { class: 'tgrp', text: 'This PC' }));
    if (!roots.drives.length) t.append(h('div', { class: 'tmsg', text: 'No drives are set up. Add them under "explorer" in the settings file.' }));
    roots.drives.forEach((d) => addNode(t, d.id, '', d.name, true, 0));
    if ((roots.apps || []).length) {
      t.append(h('div', { class: 'tgrp', text: 'Apps' }));
      roots.apps.forEach((a) => {
        const row = h('div', { class: 'tn', style: 'padding-left:4px' });
        const b = h('button', { class: 'tname', style: 'padding-left:26px', title: 'Open ' + a.name, text: a.name });
        b.addEventListener('click', async (ev) => {
          const r = await (ev.shiftKey && window.cc.snapApp ? window.cc.snapApp(a.id) : window.cc.launchApp(a.id));
          if (!r || !r.ok) { const m = h('div', { class: 'tmsg', text: (r && r.error) || 'Could not start ' + a.name + '.' }); row.after(m); setTimeout(() => m.remove(), 6000); }
        });
        row.append(b);
        t.append(row);
      });
    }
    t.scrollTop = keepScroll;
  }

  async function loadDir(project, rel) {
    const k = tkey(project, rel);
    kids.set(k, 'loading');
    renderTree();
    const r = await window.cc.listDir(project, rel);
    kids.set(k, r && r.ok && !r.isFile ? r.entries : (r && r.ok ? [] : { error: (r && r.error) || 'Could not open.' }));
    renderTree();
  }

  function toggle(project, rel, forceOpen) {
    const k = tkey(project, rel);
    if (expanded.has(k) && !forceOpen) { expanded.delete(k); renderTree(); return; }
    expanded.add(k);
    if (!Array.isArray(kids.get(k))) loadDir(project, rel); else renderTree();
  }

  // Open the folders leading to a place, mark it, and expand it if it is a folder.
  async function reveal(project, path) {
    sel = { project, path };
    const keepClosed = collapsing === tkey(project, path);
    collapsing = null;
    const segs = path ? path.split('/') : [];
    let rel = '';
    if (!path && keepClosed) { renderTree(); return; }
    expanded.add(tkey(project, ''));
    if (!Array.isArray(kids.get(tkey(project, '')))) await loadDir(project, '');
    for (let i = 0; i < segs.length - 1; i++) {
      rel = join(rel, segs[i]);
      expanded.add(tkey(project, rel));
      if (!Array.isArray(kids.get(tkey(project, rel)))) await loadDir(project, rel);
    }
    if (path && !keepClosed) {
      const r = await window.cc.listDir(project, path);
      if (r && r.ok && !r.isFile) {
        expanded.add(tkey(project, path));
        if (!Array.isArray(kids.get(tkey(project, path)))) await loadDir(project, path);
      }
    }
    renderTree();
  }


  async function load() {
    const my = ++seq;
    await refreshRoots();
    view = null;
    if (!loc.project || !rootById(loc.project)) { render(); return; }
    const r = await window.cc.listDir(loc.project, loc.path);
    if (my !== seq) return;
    if (!r || !r.ok) view = { kind: 'error', error: (r && r.error) || 'Could not open this.' };
    else if (r.isFile) {
      const f = await window.cc.readFile(loc.project, loc.path);
      if (my !== seq) return;
      view = { kind: 'file', info: r, file: f };
    } else view = { kind: 'dir', entries: r.entries, truncated: r.truncated };
    render();
  }

  function applyLoc(p) {
    loc = { project: (p && typeof p.project === 'string' && p.project) || null, path: (p && typeof p.path === 'string' && p.path) || '' };
    note = null;
    if (loc.project) reveal(loc.project, loc.path); else { sel = { project: null, path: '' }; renderTree(); }
    load();
  }

  async function act(fn, okText) {
    const r = await fn();
    note = r && r.ok ? { ok: true, text: okText } : { ok: false, text: (r && r.error) || 'Could not do that.' };
    render();
  }

  function folderCard(id, name, path, rel, extra) {
    return h('button', { class: 'card proj', onclick: () => goTo(id, rel || '') },
      h('div', { class: 'name', text: name }),
      h('div', { class: 'path', text: path }),
      extra && h('div', { class: 'row' }, extra));
  }

  function renderAll() {
    const children = [h('h1', { text: 'Explorer' }), h('p', { class: 'sub', text: 'Pick a favourite or a drive, or browse the folders on the left. Click the star next to any folder to keep it in your favourites.' })];
    children.push(h('h2', { text: 'Favourites' }));
    const favGrid = h('div', { class: 'grid' });
    roots.projects.forEach((p) => {
      const n = activeCount(p.id);
      favGrid.append(folderCard(p.id, p.name, p.path, '', [
        App.data.focusProject === p.id && h('span', { class: 'tag accent', text: 'Focus' }),
        h('span', { class: 'tag', text: n + (n === 1 ? ' open task' : ' open tasks') })]));
    });
    roots.favs.forEach((f) => { const r = rootById(f.root); if (r) favGrid.append(folderCard(f.root, f.name, fullPath(r, f.rel), f.rel)); });
    if (favGrid.children.length) children.push(favGrid);
    else children.push(h('div', { class: 'empty', text: 'No favourites yet.' }));
    children.push(h('h2', { style: 'margin-top:28px', text: 'This PC' }));
    if (roots.drives.length) {
      const grid = h('div', { class: 'grid' });
      roots.drives.forEach((d) => grid.append(folderCard(d.id, d.name, d.path, '')));
      children.push(grid);
    } else children.push(h('div', { class: 'empty', text: 'No drives are set up. Add them under "explorer" in the settings file (cog in the left rail).' }));
    if ((roots.apps || []).length) {
      children.push(h('h2', { style: 'margin-top:28px', text: 'Apps' }));
      children.push(h('div', { class: 'row' }, roots.apps.map((a) => h('button', { title: 'Shift+click: open side by side with Workstation', onclick: (ev) => act(() => (ev.shiftKey && window.cc.snapApp ? window.cc.snapApp(a.id) : window.cc.launchApp(a.id)), 'Opened ' + a.name + '.') }, a.name))));
      children.push(noteBox());
    }
    show(children);
  }

  function crumbsFor(p, path, nav, homeNav) {
    const segs = path ? path.split('/') : [];
    const btn = (label, project, rel) => { const b = h('button', { class: 'ghost', onclick: () => nav(project, rel), text: label }); makeDropTarget(b, project, rel); return b; };
    const bar = h('div', { class: 'crumbs', role: 'navigation', 'aria-label': 'Folder path' },
      h('button', { class: 'ghost', onclick: homeNav, text: 'Explorer' }), '›');
    if (!segs.length) bar.append(h('span', { class: 'here', text: p.name }));
    else {
      bar.append(btn(p.name, p.id, ''));
      segs.forEach((seg, i) => {
        bar.append('›');
        if (i === segs.length - 1) bar.append(h('span', { class: 'here', text: seg }));
        else bar.append(btn(seg, p.id, segs.slice(0, i + 1).join('/')));
      });
    }
    return bar;
  }
  const crumbs = (p) => crumbsFor(p, loc.path, goTo, () => goTo('', ''));

  function noteBox() { return note && h('div', { class: 'msg ' + (note.ok ? 'ok' : 'err'), text: note.text }); }

  function tasksBlock(p) {
    const tasks = sortTasks(App.data.tasks.filter((t) => t.project === p.id));
    const active = tasks.filter((t) => !t.done);
    const done = tasks.filter((t) => t.done);
    // Keep a half-typed task if this page re-draws because something else changed.
    const prevTitle = document.getElementById('pTitle');
    const prevDue = document.getElementById('pDue');
    const keepTitle = prevTitle && prevTitle.dataset.project === p.id ? prevTitle.value : '';
    const keepDue = prevDue && prevDue.dataset.project === p.id ? prevDue.value : '';
    const hadFocus = prevTitle && document.activeElement === prevTitle;
    const input = h('input', { id: 'pTitle', 'data-project': p.id, type: 'text', class: 'grow', maxlength: '500', placeholder: 'Add a task for ' + p.name, 'aria-label': 'New task for ' + p.name, value: keepTitle });
    const due = h('input', { id: 'pDue', 'data-project': p.id, type: 'date', 'aria-label': 'Due date', value: keepDue });
    const form = h('form', { class: 'row', autocomplete: 'off', onsubmit: async (e) => {
      e.preventDefault();
      if (!input.value.trim()) { input.focus(); return; }
      const title = input.value; const dueValue = due.value;
      input.value = ''; due.value = '';
      await addTask(title, p.id, dueValue);
    } }, input, due, h('button', { class: 'primary', type: 'submit', text: 'Add' }));
    if (hadFocus) setTimeout(() => input.focus(), 0);
    return [
      h('h2', { style: 'margin-top:28px', text: 'Tasks for this project' }),
      form,
      active.length ? active.map(taskRow) : h('div', { class: 'empty', text: 'No open tasks.' }),
      done.length > 0 && h('div', { class: 'group-title', text: 'Done (' + done.length + ')' }),
      done.map(taskRow),
    ];
  }

  // ---- column widths and sorting (remembered on this computer) ----
  const COLS = { cn: null, cm: 130, cs: 80 }; // cn = Name width in pixels, or null to fill the space
  const SORT = { key: 'name', dir: 1 };
  try {
    const sv = JSON.parse(localStorage.getItem('th-explorer-cols') || 'null');
    if (sv) {
      if (Number.isFinite(sv.cn) && sv.cn >= 120 && sv.cn <= 2000) COLS.cn = sv.cn;
      if (Number.isFinite(sv.cm) && sv.cm >= 70 && sv.cm <= 400) COLS.cm = sv.cm;
      if (Number.isFinite(sv.cs) && sv.cs >= 50 && sv.cs <= 300) COLS.cs = sv.cs;
      if (['name', 'mtime', 'size'].includes(sv.key)) SORT.key = sv.key;
      if (sv.dir === 1 || sv.dir === -1) SORT.dir = sv.dir;
    }
  } catch { /* defaults */ }
  const saveCols = () => { try { localStorage.setItem('th-explorer-cols', JSON.stringify({ ...COLS, key: SORT.key, dir: SORT.dir })); } catch { /* not remembered */ } };
  const applyCols = (el) => {
    el.style.setProperty('--cn', COLS.cn ? COLS.cn + 'px' : 'minmax(0,1fr)');
    el.style.setProperty('--cm', COLS.cm + 'px');
    el.style.setProperty('--cs', COLS.cs + 'px');
  };
  const sortedEntries = (entries) => entries.slice().sort((a, b) => {
    if (a.dir !== b.dir) return a.dir ? -1 : 1; // folders stay on top, as in File Explorer
    let r;
    if (SORT.key === 'mtime') r = (a.mtime || 0) - (b.mtime || 0);
    else if (SORT.key === 'size') r = (a.dir ? 0 : a.size || 0) - (b.dir ? 0 : b.size || 0);
    else r = 0;
    const byName = a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' });
    return SORT.key === 'name' ? byName * SORT.dir : (r * SORT.dir || byName);
  });
  function headCell(label, key, prop, min, max, nameCol) {
    const th = h('span', { class: 'hc', title: 'Click to sort. Drag the edge to resize.', onclick: () => {
      if (SORT.key === key) SORT.dir = -SORT.dir; else { SORT.key = key; SORT.dir = key === 'name' ? 1 : -1; }
      saveCols(); render();
    } }, label + (SORT.key === key ? (SORT.dir === 1 ? ' ▲' : ' ▼') : ''));
    const rz = h('span', { class: 'rz', role: 'separator', 'aria-hidden': 'true', onclick: (e) => e.stopPropagation(), onpointerdown: (e) => {
      e.preventDefault(); e.stopPropagation();
      const startX = e.clientX, start = th.getBoundingClientRect().width;
      rz.setPointerCapture(e.pointerId);
      const move = (ev) => { COLS[prop] = Math.max(min, Math.min(max, Math.round(start + ev.clientX - startX))); document.querySelectorAll('.files').forEach(applyCols); };
      const up = () => { rz.removeEventListener('pointermove', move); rz.removeEventListener('pointerup', up); rz.removeEventListener('pointercancel', up); saveCols(); };
      rz.addEventListener('pointermove', move); rz.addEventListener('pointerup', up); rz.addEventListener('pointercancel', up);
    }, ondblclick: (e) => { e.stopPropagation(); COLS[prop] = nameCol ? null : (prop === 'cm' ? 130 : 80); document.querySelectorAll('.files').forEach(applyCols); saveCols(); } });
    th.append(rz);
    return th;
  }
  function buildList(p, entries, curPath, onDir, onFile) {
    entries = sortedEntries(entries);
    const list = h('div', { class: 'files', role: 'list' },
      h('div', { class: 'frow head', role: 'presentation' }, headCell('Name', 'name', 'cn', 120, 2000, true), headCell('Modified', 'mtime', 'cm', 70, 400), headCell('Size', 'size', 'cs', 50, 300)));
    applyCols(list);
    if (!entries.length) list.append(h('div', { class: 'empty', style: 'padding:14px', text: 'This folder is empty. Drop files here to add them.' }));
    entries.forEach((en) => {
      const rel = join(curPath, en.name);
      const row = h('button', { class: 'frow', role: 'listitem', 'data-root': p.id, 'data-rel': rel, 'data-dir': en.dir ? '1' : '', onclick: () => (en.dir ? onDir(rel) : onFile(rel)) },
        h('span', { class: 'n' }, h('span', { class: 'ico' + (en.dir ? ' dir' : ''), 'aria-hidden': 'true' }), h('span', { class: 't', text: en.name })),
        h('span', { class: 'm', text: dateLabel(en.mtime) }),
        h('span', { class: 'm', text: en.dir ? '' : sizeLabel(en.size) }));
      makeDraggable(row, p.id, rel, en.dir);
      if (en.dir) makeDropTarget(row, p.id, rel);
      list.append(row);
    });
    return list;
  }
  const dragHint = () => h('div', { class: 'muted', style: 'font-size:12px;margin-top:8px', text: 'Drag a file onto a folder to move it (hold Ctrl to copy). Drop files from Windows to copy them in. Hold Alt while dragging a file to drag it out to Windows.' });

  function renderDir(p) {
    const atRoot = !loc.path;
    const isFocus = App.data.focusProject === p.id;
    const proj = isProject(p.id);
    const actions = h('div', { class: 'row actions' },
      h('button', { class: 'primary', onclick: () => act(() => window.cc.openFile(p.id, loc.path), 'Opened in File Explorer.') }, 'Open in File Explorer'),
      !atRoot && favButton(p),
      atRoot && proj && h('button', { onclick: () => window.cc.openArcane() }, 'Arcane terminals'),
      atRoot && proj && h('button', { class: isFocus ? '' : 'ghost', onclick: () => App.save({ focusProject: isFocus ? null : p.id }) }, isFocus ? '★ Focus project (click to clear)' : '☆ Make this my focus'));

    actions.append(h('button', { class: split ? '' : 'ghost', onclick: toggleSplit }, split ? 'Close split view' : 'Split view'));
    const list = buildList(p, view.entries, loc.path, (rel) => goTo(p.id, rel), (rel) => goTo(p.id, rel));

    show(crumbs(p), h('h1', { text: loc.path ? loc.path.split('/').pop() : p.name }), h('p', { class: 'sub', text: fullPath(p, loc.path) }),
      actions, noteBox(), list, dragHint(),
      view.truncated && h('div', { class: 'muted', style: 'margin-top:8px', text: 'Showing the first 1000 items.' }),
      atRoot && proj && tasksBlock(p));
  }

  function renderFile(p) {
    const f = view.file;
    const name = loc.path.split('/').pop();
    let body;
    if (!f || !f.ok) body = h('div', { class: 'msg err', text: (f && f.error) || 'Could not read this file.' });
    else if (f.kind === 'text') body = [h('pre', { class: 'preview', text: f.text }), f.truncated && h('div', { class: 'muted', style: 'margin-top:8px', text: 'Showing the first part of this file. Open it to see the rest.' })];
    else if (f.kind === 'image') body = h('img', { class: 'preview', src: f.dataUrl, alt: name });
    else body = h('div', { class: 'empty', text: f.note || 'No preview for this type of file. Use Open to view it in its own app.' });
    show(crumbs(p), h('h1', { style: 'word-break:break-word', text: name }), h('p', { class: 'sub', text: sizeLabel(view.info.size) + ' · modified ' + dateLabel(view.info.mtime) }),
      h('div', { class: 'row actions' },
        h('button', { class: 'primary', onclick: () => act(() => window.cc.openFile(p.id, loc.path), 'Opened.') }, 'Open'),
        h('button', { onclick: () => act(() => window.cc.revealFile(p.id, loc.path), 'Shown in File Explorer.') }, 'Show in File Explorer'),
        ...openWithButtons(p),
        h('button', { class: 'ghost', onclick: () => goTo(p.id, parentOf(loc.path)) }, '‹ Back to folder')),
      noteBox(), body);
  }

  function openWithButtons(p) {
    const ext = (/\.[^./]+$/.exec(loc.path) || [''])[0].toLowerCase();
    return (roots.apps || []).filter((a) => a.types.includes(ext)).map((a) =>
      h('button', { onclick: () => act(() => window.cc.openWith(a.id, p.id, loc.path), 'Opened in ' + (a.label || a.name) + '.') }, 'Open in ' + (a.label || a.name)));
  }

  function favButton(p) {
    const on = isFav(p.id, loc.path);
    return h('button', { class: on ? '' : 'ghost', onclick: async () => {
      const r = await window.cc.toggleFav(p.id, loc.path, loc.path.split('/').pop());
      if (r && r.ok) roots.favs = r.favs; else note = { ok: false, text: (r && r.error) || 'Could not change favourites.' };
      renderTree(); render();
    } }, on ? '★ Favourite (click to remove)' : '☆ Add to favourites');
  }

  function render() {
    const p = rootById(loc.project);
    if (!loc.project || !p) return renderAll();
    if (!view) return show(h('div', { class: 'empty', text: 'Loading…' }));
    if (view.kind === 'error') {
      return show(crumbs(p), h('div', { class: 'msg err', text: view.error }), h('button', { onclick: () => goTo(p.id, '') }, 'Back to ' + p.name));
    }
    if (view.kind === 'file') return renderFile(p);
    renderDir(p);
  }

  // ---- drag and drop ----
  const clearDrop = () => document.querySelectorAll('.droptarget').forEach((n) => n.classList.remove('droptarget'));
  // Moving inside the app uses the mouse directly (reliable in every window). Dropping files in from Windows uses the browser's own drop events.
  const dropTargets = new WeakMap();   // element -> function returning { root, rel } or null
  let justDragged = false;
  document.addEventListener('click', (e) => { if (justDragged) { e.preventDefault(); e.stopPropagation(); justDragged = false; } }, true);

  function targetAt(x, y, from) {
    for (let n = document.elementFromPoint(x, y); n; n = n.parentElement) {
      const f = dropTargets.get(n);
      if (f) { const t = f(); if (t && !(from && t.root === from.root && t.rel === from.rel)) return { node: n, t }; }
    }
    return null;
  }

  function makeDraggable(node, rootId, rel, isDir) {
    node.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      e.preventDefault(); // stops Windows starting a text-selection or built-in drag instead of ours
      const sx = e.clientX, sy = e.clientY;
      const from = { root: rootId, rel };
      let ghost = null, hit = null, active = false;
      const label = rel.split('/').pop();
      const stop = () => {
        document.removeEventListener('mousemove', move, true);
        document.removeEventListener('mouseup', up, true);
        document.removeEventListener('keydown', key, true);
        if (ghost) ghost.remove();
        clearDrop();
        document.body.style.userSelect = '';
        drag = null;
      };
      const key = (ev) => { if (ev.key === 'Escape') { ev.preventDefault(); stop(); justDragged = active; } };
      const move = (ev) => {
        if (!active) {
          if (Math.abs(ev.clientX - sx) + Math.abs(ev.clientY - sy) < 6) return;
          if (ev.altKey && !isDir) { stop(); window.cc.dragOut(rootId, rel); justDragged = true; return; } // Alt: a real Windows drag, for other programs and folders
          active = true; drag = from;
          document.body.style.userSelect = 'none';
          ghost = h('div', { style: 'position:fixed;z-index:80;pointer-events:none;padding:5px 10px;border-radius:8px;background:var(--card);border:1px solid var(--accent);box-shadow:0 6px 20px rgba(0,0,0,.25);font-size:13px;max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap', text: label });
          document.body.append(ghost);
        }
        ghost.style.left = (ev.clientX + 14) + 'px'; ghost.style.top = (ev.clientY + 10) + 'px';
        hit = targetAt(ev.clientX, ev.clientY, null);
        clearDrop();
        if (hit) { hit.node.classList.add('droptarget'); ghost.textContent = (ev.ctrlKey ? 'Copy ' : 'Move ') + label; } else ghost.textContent = label;
        ev.preventDefault();
      };
      const up = (ev) => {
        const t = active ? targetAt(ev.clientX, ev.clientY, null) : null;
        const copy = ev.ctrlKey;
        const was = active;
        stop();
        if (was) { justDragged = true; setTimeout(() => { justDragged = false; }, 50); }
        if (t) moveItem(from, t.t.root, t.t.rel, copy);
      };
      document.addEventListener('mousemove', move, true);
      document.addEventListener('mouseup', up, true);
      document.addEventListener('keydown', key, true);
    });
  }

  // target: a root id plus a path, or a function that returns { root, rel } (or null) when the drop happens
  function makeDropTarget(node, targetOrRoot, rel) {
    const resolve = () => (typeof targetOrRoot === 'function' ? targetOrRoot() : { root: targetOrRoot, rel: rel || '' });
    dropTargets.set(node, resolve);
    // files dragged in from Windows
    const wants = (e) => { const t = e.dataTransfer && e.dataTransfer.types ? [...e.dataTransfer.types] : []; return t.includes('Files'); };
    node.addEventListener('dragover', (e) => {
      if (!wants(e) || !resolve()) return;
      e.preventDefault(); e.stopPropagation();
      e.dataTransfer.dropEffect = 'copy';
      if (!node.classList.contains('droptarget')) { clearDrop(); node.classList.add('droptarget'); }
    });
    node.addEventListener('dragleave', (e) => { if (!node.contains(e.relatedTarget)) node.classList.remove('droptarget'); });
    node.addEventListener('drop', (e) => {
      const t = resolve();
      if (!wants(e) || !t) return;
      e.preventDefault(); e.stopPropagation(); clearDrop();
      importDropped(e, t.root, t.rel);
    });
  }

  const needsRestart = () => { note = { ok: false, text: 'Drag and drop needs the full app to be restarted once (close Transform Workstation and start it again).' }; render(); };
  async function moveItem(from, dstRoot, dstRel, copy) {
    if (!window.cc.transferFile) { needsRestart(); return; }
    let r;
    try { r = await window.cc.transferFile(from.root, from.rel, dstRoot, dstRel, copy); } catch { r = null; }
    note = r && r.ok ? { ok: true, text: r.same ? 'It is already in that folder.' : (copy ? 'Copied' : 'Moved') + ' ' + (r.name || 'the item') + '.' } : { ok: false, text: (r && r.error) || 'Could not do that.' };
    refreshAll();
  }
  async function importDropped(e, dstRoot, dstRel) {
    if (!window.cc.importFiles || !window.cc.pathForFile) { needsRestart(); return; }
    const paths = [...e.dataTransfer.files].map((f) => window.cc.pathForFile(f)).filter(Boolean);
    if (!paths.length) { note = { ok: false, text: 'Windows did not give a location for that item, so it could not be copied.' }; render(); return; }
    let r;
    try { r = await window.cc.importFiles(dstRoot, dstRel, paths); } catch { r = null; }
    if (!r) note = { ok: false, text: 'Could not copy those files.' };
    else if (r.failed && r.failed.length) note = { ok: r.done > 0, text: (r.done ? 'Copied ' + r.done + (r.done === 1 ? ' item' : ' items') + '. ' : '') + r.failed[0] + (r.failed.length > 1 ? ' (and ' + (r.failed.length - 1) + ' more)' : '') };
    else note = { ok: true, text: 'Copied ' + r.done + (r.done === 1 ? ' item' : ' items') + '.' };
    refreshAll();
  }
  function refreshAll() {
    kids.clear();
    [...expanded].forEach((k) => { const [pr, rl] = k.split('\u0001'); loadDir(pr, rl); });
    load();
    loadPaneB();
  }
  // anything dropped on empty space is ignored, and never opened as a page
  document.addEventListener('dragover', (e) => { e.preventDefault(); if (e.dataTransfer) e.dataTransfer.dropEffect = 'none'; });
  document.addEventListener('drop', (e) => { e.preventDefault(); clearDrop(); });
  makeDropTarget(root, () => (!split && loc.project && view && view.kind === 'dir' ? { root: loc.project, rel: loc.path } : null));

  // ---- second pane (split view) ----
  function setActive(which) {
    if (active === which) return;
    active = which;
    const a = document.getElementById('paneA'), b = document.getElementById('paneB');
    if (a) a.classList.toggle('active', which === 'a');
    if (b) b.classList.toggle('active', which === 'b');
    const q = which === 'a' ? loc : paneB;
    if (q.project) reveal(q.project, q.path);
  }
  function toggleSplit() {
    split = !split;
    if (split) { paneB = { project: loc.project, path: loc.path, entries: null, error: null }; active = 'a'; loadPaneB(); } else { active = 'a'; render(); }
  }
  async function loadPaneB() {
    if (!split) return;
    const my = paneB;
    if (!paneB.project || !rootById(paneB.project)) { paneB.entries = null; render(); return; }
    const r = await window.cc.listDir(paneB.project, paneB.path);
    if (my !== paneB) return;
    if (r && r.ok && !r.isFile) { paneB.entries = r.entries; paneB.error = null; }
    else { paneB.entries = null; paneB.error = (r && r.error) || 'Could not open this.'; }
    render();
  }
  function openPaneB(project, path) {
    paneB = { project: project || null, path: path || '', entries: null, error: null };
    loadPaneB();
  }
  function paneBEl() {
    const p = rootById(paneB.project);
    const box = h('div', { class: 'pane' + (active === 'b' ? ' active' : ''), id: 'paneB', onclick: () => setActive('b') });
    makeDropTarget(box, () => (p && paneB.entries ? { root: p.id, rel: paneB.path } : null));
    const close = h('button', { class: 'ghost', title: 'Close split view', 'aria-label': 'Close split view', onclick: (e) => { e.stopPropagation(); toggleSplit(); }, text: '✕' });
    if (!p) {
      box.append(h('div', { class: 'paneHead' }, h('h2', { style: 'margin:0', text: 'Second folder' }), close),
        h('div', { class: 'empty', text: 'Click this pane, then pick a folder in the tree on the left to show it here.' }));
      return box;
    }
    box.append(h('div', { class: 'paneHead' }, crumbsFor(p, paneB.path, (pr, rl) => openPaneB(pr, rl), () => openPaneB(null, '')), close),
      h('h1', { text: paneB.path ? paneB.path.split('/').pop() : p.name }),
      h('p', { class: 'sub', text: fullPath(p, paneB.path) }));
    if (paneB.error) box.append(h('div', { class: 'msg err', text: paneB.error }));
    else if (!paneB.entries) box.append(h('div', { class: 'empty', text: 'Loading…' }));
    else box.append(buildList(p, paneB.entries, paneB.path, (rel) => openPaneB(p.id, rel), (rel) => act(() => window.cc.openFile(p.id, rel), 'Opened.')));
    return box;
  }

  // ---- right-click menu and Properties ----
  let menuEl = null;
  function closeMenu() { if (menuEl) { menuEl.remove(); menuEl = null; } }
  function closeModal() { const m = document.getElementById('propsModal'); if (m) m.remove(); }

  async function showProps(p, rel) {
    const r = await window.cc.getProperties(p.id, rel);
    if (!r || !r.ok) { note = { ok: false, text: (r && r.error) || 'Could not read the properties.' }; render(); return; }
    const when = (ms) => (ms ? new Date(ms).toLocaleString('en-AU', { day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit' }) : 'Unknown');
    const rows = [['Name', r.name], ['Type', r.kind === 'folder' ? 'Folder' : (r.type ? r.type + ' file' : 'File')], ['Location', r.path],
      r.kind === 'folder' ? ['Contains', r.items == null ? 'Unknown' : r.items + (r.items === 1 ? ' item' : ' items')] : ['Size', sizeLabel(r.size) + ' (' + r.size.toLocaleString('en-AU') + ' bytes)'],
      ['Created', when(r.created)], ['Modified', when(r.modified)], ['Opened', when(r.accessed)], ['Read-only', r.readOnly ? 'Yes' : 'No']];
    closeModal();
    const close = h('button', { class: 'primary', onclick: closeModal, text: 'Close' });
    const modal = h('div', { class: 'modal', id: 'propsModal', onclick: (e) => { if (e.target === modal) closeModal(); } },
      h('div', { class: 'card box', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Properties' },
        h('h2', { text: 'Properties' }),
        h('dl', {}, rows.flatMap(([k, v]) => [h('dt', { text: k }), h('dd', { text: v })])),
        h('div', { class: 'row' }, close)));
    document.body.append(modal);
    close.focus();
  }

  const WEB_EXT = { '.xlsx': 'Excel', '.xls': 'Excel', '.xlsb': 'Excel', '.csv': 'Excel', '.xltx': 'Excel', '.docx': 'Word', '.doc': 'Word', '.dotx': 'Word', '.rtf': 'Word', '.pptx': 'PowerPoint', '.ppt': 'PowerPoint' };
  async function openWeb(p, rel, label) {
    if (!window.cc.openInWeb) { needsRestart(); return; }
    note = { ok: true, text: 'Sending to your OneDrive (My files > Documents), then opening in ' + label + ' (web)…' }; render();
    let r; try { r = await window.cc.openInWeb(p.id, rel); } catch { r = null; }
    note = r && r.ok ? { ok: true, text: 'Opened ' + (r.name || 'the file') + ' in ' + label + ' (web). A copy is in OneDrive, My files, Documents.' } : { ok: false, text: (r && r.error) || 'Could not open it.' };
    render();
  }

  function openMenu(x, y, p, rel, isDir) {
    closeMenu();
    const isFav0 = isDir && rel && isFav(p.id, rel);
    const ext = (/\.[^./]+$/.exec(rel) || [''])[0].toLowerCase();
    const item = (label, fn) => h('button', { role: 'menuitem', onclick: () => { closeMenu(); fn(); } }, label);
    const items = [];
    if (isDir) {
      if (rel !== loc.path) items.push(item('Open', () => goTo(p.id, rel)));
      items.push(item('Open in File Explorer', () => act(() => window.cc.openFile(p.id, rel), 'Opened in File Explorer.')));
    } else {
      items.push(item('Open', () => act(() => window.cc.openFile(p.id, rel), 'Opened.')));
      items.push(item('Show in File Explorer', () => act(() => window.cc.revealFile(p.id, rel), 'Shown in File Explorer.')));
      (roots.apps || []).filter((a) => a.types.includes(ext)).forEach((a) => items.push(item('Open in ' + (a.label || a.name), () => act(() => window.cc.openWith(a.id, p.id, rel), 'Opened in ' + (a.label || a.name) + '.'))));
    }
    const web = WEB_EXT[ext];
    if (!isDir && web) items.push(item('Open in ' + web + ' (web)', () => openWeb(p, rel, web)));
    items.push(h('hr'));
    items.push(item('Open in PowerShell here', () => act(() => window.cc.openPowerShell(p.id, rel), 'Opened PowerShell.')));
    items.push(item('Copy path', () => act(() => window.cc.copyPath(p.id, rel), 'Path copied.')));
    if (isDir && rel) items.push(item(isFav0 ? 'Remove from favourites' : 'Add to favourites', async () => {
      const r = await window.cc.toggleFav(p.id, rel, rel.split('/').pop());
      if (r && r.ok) roots.favs = r.favs; else note = { ok: false, text: (r && r.error) || 'Could not change favourites.' };
      renderTree(); render();
    }));
    items.push(h('hr'));
    items.push(item('Properties', () => showProps(p, rel)));
    const menu = h('div', { class: 'ctx', role: 'menu' }, items);
    document.body.append(menu);
    const w = menu.offsetWidth, hgt = menu.offsetHeight;
    menu.style.left = Math.max(4, Math.min(x, window.innerWidth - w - 4)) + 'px';
    menu.style.top = Math.max(4, Math.min(y, window.innerHeight - hgt - 4)) + 'px';
    menuEl = menu;
    const first = menu.querySelector('button'); if (first) first.focus();
  }

  document.addEventListener('contextmenu', (e) => {
    if (e.target.closest('.ctx, .modal, input, textarea, pre.preview, #tree')) return; // keep normal editing and copying menus (the tree has its own)
    const row = e.target.closest('.frow[data-rel]');
    if (row) { const rp = rootById(row.dataset.root); if (!rp) return; e.preventDefault(); openMenu(e.clientX, e.clientY, rp, row.dataset.rel, row.dataset.dir === '1'); return; }
    if (e.target.closest('#paneB')) { const bp = rootById(paneB.project); if (bp) { e.preventDefault(); openMenu(e.clientX, e.clientY, bp, paneB.path, true); } return; }
    const p = rootById(loc.project);
    if (!p || !view) return; // the list of places has nothing to act on
    e.preventDefault();
    if (view.kind === 'dir') openMenu(e.clientX, e.clientY, p, loc.path, true);
    else if (view.kind === 'file') openMenu(e.clientX, e.clientY, p, loc.path, false);
  });
  document.addEventListener('click', (e) => { if (menuEl && !menuEl.contains(e.target)) closeMenu(); });
  window.addEventListener('blur', closeMenu);
  window.addEventListener('resize', closeMenu);
  document.addEventListener('scroll', closeMenu, true);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { if (menuEl) { closeMenu(); e.preventDefault(); } else if (document.getElementById('propsModal')) { closeModal(); e.preventDefault(); } return; }
    if (menuEl && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
      const b = [...menuEl.querySelectorAll('button')]; const i = b.indexOf(document.activeElement);
      b[(i + (e.key === 'ArrowDown' ? 1 : -1) + b.length) % b.length].focus(); e.preventDefault();
    }
  });

  window.cc.onNavigate((p) => applyLoc(p));
  window.cc.getRoots().then((r) => { roots = r || roots; App.init(() => { if (!started) { started = true; load(); } else render(); }); });
</script>
</body>
