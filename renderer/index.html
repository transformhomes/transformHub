<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>TH Command Centre</title>
<style>
  :root { --bg:#0f1115; --rail:#14171d; --fg:#c9d1d9; --muted:#6b7480; --accent:#4c9bff; --hover:#1f242c; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family: "Segoe UI", system-ui, sans-serif; overflow:hidden; user-select:none; }
  #rail { width:64px; height:100%; background:var(--rail); border-right:1px solid #232830;
    display:flex; flex-direction:column; align-items:center; padding:10px 0; gap:6px; }
  .spacer { flex:1; }
  button.item { position:relative; width:44px; height:44px; border:0; border-radius:10px; background:transparent;
    color:var(--muted); display:grid; place-items:center; cursor:pointer; }
  button.item:hover { background:var(--hover); color:var(--fg); }
  button.item.active { background:var(--hover); color:var(--accent); }
  button.item.active::before { content:""; position:absolute; left:-10px; top:10px; bottom:10px; width:3px;
    border-radius:0 3px 3px 0; background:var(--accent); }
  button.item:disabled { opacity:.35; cursor:not-allowed; }
  svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  .tip { position:fixed; left:70px; padding:5px 9px; border-radius:6px; background:#232830; color:var(--fg);
    font-size:12px; white-space:nowrap; pointer-events:none; opacity:0; transition:opacity .1s; z-index:10; }
  .tip.show { opacity:1; }
</style>
</head>
<body>
<nav id="rail" aria-label="Sections"></nav>
<div id="tip" class="tip"></div>
<script>
  const ICONS = {
    home:     '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',
    folder:   '<path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
    mail:     '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
    calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
    tasks:    '<path d="M9 6h11M9 12h11M9 18h11"/><path d="M3.5 6l1.5 1.5L7 5M3.5 12l1.5 1.5L7 11M3.5 18l1.5 1.5L7 17"/>',
    chat:     '<path d="M21 12a8 8 0 0 1-11.7 7L4 20l1.1-4.4A8 8 0 1 1 21 12z"/>',
    star:     '<path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.8 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"/>',
    briefcase:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/>',
    users:    '<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 5.3a3.2 3.2 0 0 1 0 5.4M18 14.3c1.8.8 3 2.7 3 5.7"/>',
  };
  const rail = document.getElementById('rail');
  const tip = document.getElementById('tip');
  const buttons = new Map();

  function showTip(btn, text) {
    const r = btn.getBoundingClientRect();
    tip.textContent = text;
    tip.style.top = (r.top + r.height / 2 - 14) + 'px';
    tip.classList.add('show');
  }

  function build(sections) {
    sections.forEach((s) => {
      const b = document.createElement('button');
      b.className = 'item';
      b.innerHTML = '<svg viewBox="0 0 24 24">' + (ICONS[s.icon] || ICONS.home) + '</svg>';
      b.setAttribute('aria-label', s.label);
      if (s.type === 'disabled') b.disabled = true;
      b.addEventListener('click', () => window.cc.select(s.id));
      b.addEventListener('mouseenter', () => showTip(b, s.label));
      b.addEventListener('mouseleave', () => tip.classList.remove('show'));
      rail.appendChild(b);
      buttons.set(s.id, b);
    });
    const spacer = document.createElement('div'); spacer.className = 'spacer'; rail.appendChild(spacer);

    const reload = document.createElement('button');
    reload.className = 'item'; reload.setAttribute('aria-label', 'Reload this section');
    reload.innerHTML = '<svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg>';
    reload.addEventListener('click', () => window.cc.reload());
    reload.addEventListener('mouseenter', () => showTip(reload, 'Reload (Ctrl+R)'));
    reload.addEventListener('mouseleave', () => tip.classList.remove('show'));
    rail.appendChild(reload);

    const cfg = document.createElement('button');
    cfg.className = 'item'; cfg.setAttribute('aria-label', 'Edit settings');
    cfg.innerHTML = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/></svg>';
    cfg.addEventListener('click', () => window.cc.openConfig());
    cfg.addEventListener('mouseenter', () => showTip(cfg, 'Edit settings file'));
    cfg.addEventListener('mouseleave', () => tip.classList.remove('show'));
    rail.appendChild(cfg);
  }

  window.cc.onSelected((id) => {
    buttons.forEach((b, key) => b.classList.toggle('active', key === id));
  });
  window.cc.getSections().then(async (sections) => {
    build(sections);
    const current = await window.cc.getCurrent();
    if (current) buttons.forEach((b, key) => b.classList.toggle('active', key === current));
  });
</script>
</body>
</html>
