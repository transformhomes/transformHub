<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src data:">
<title>Home</title>
<link rel="stylesheet" href="shared.css">
<style>
  #bg { position:fixed; inset:0; z-index:0; background-size:cover; background-position:center; background-repeat:no-repeat; display:none; }
  #bg.on { display:block; }
  #bg::after { content:''; position:absolute; inset:0; background:var(--bg); opacity:var(--dim, .35); }
  .page { position:relative; z-index:1; }
  .tile { box-shadow:0 1px 3px rgba(0,0,0,.25); }
  .cols { display:grid; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); gap:16px; margin-top:18px; }
  .card h2 { display:flex; justify-content:space-between; align-items:baseline; }
  .count { font-size:12px; color:var(--muted); font-weight:400; }
  .ev { display:flex; gap:10px; padding:6px 0; border-bottom:1px solid var(--line); }
  .ev .when { color:var(--muted); font-size:12.5px; min-width:84px; }
  #recentSlot { margin-top:16px; }
  #recentSlot:empty { display:none; }
  .rc-head { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:8px; }
  .rc-head h2 { margin:0; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { padding:4px 12px; border-radius:20px; font-size:12.5px; background:var(--panel); }
  .chip[aria-pressed="true"] { background:var(--accent-bg); border-color:var(--accent-bg); color:var(--chip-fg); font-weight:600; }
  .rc-line { display:flex; align-items:center; gap:4px; border-bottom:1px solid var(--line); }
  .rc-line:last-child { border-bottom:0; }
  .rc-row { display:flex; align-items:center; gap:12px; flex:1; min-width:0; text-align:left; padding:8px 10px; border:0; border-radius:8px; background:transparent; }
  .rc-row:hover, .rc-row:focus-visible { background:var(--hover); }
  .rc-badge { flex:none; width:34px; height:34px; border-radius:8px; display:grid; place-items:center; color:#fff; font-size:10.5px; font-weight:700; letter-spacing:.02em; }
  .rc-badge.doc { background:#2b6cd4; } .rc-badge.xls { background:#1d8a4f; } .rc-badge.pdf { background:#c8382c; } .rc-badge.dir { background:#d79a1c; } .rc-badge.ppt { background:#c4561e; } .rc-badge.oth { background:#6b7788; }
  .rc-main { flex:1; min-width:0; }
  .rc-name { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rc-path { color:var(--muted); font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; direction:rtl; text-align:left; }
  .rc-when { flex:none; color:var(--muted); font-size:12.5px; min-width:110px; text-align:right; }
  .rc-show { flex:none; padding:3px 10px; font-size:12px; }
  .rc-more { margin-top:8px; }
  .focus { cursor:pointer; text-align:left; width:100%; }
  .focus:hover { border-color:var(--accent); }
  #outlookSlot { margin-top:14px; }
  #outlookSlot:empty { display:none; }
  .sum { display:flex; gap:28px; flex-wrap:wrap; align-items:center; }
  .sum .big { font-size:26px; font-weight:600; line-height:1.1; }
  .sum button.stat { text-align:left; background:transparent; border:0; padding:4px 0; cursor:pointer; }
  .sum button.stat:hover .big { color:var(--accent); }
  .cal { width:100%; border-collapse:separate; border-spacing:2px; table-layout:fixed; }
  .cal th { font-size:11px; font-weight:600; color:var(--muted); padding:2px 0; }
  .cal td { padding:0; }
  .cal button.day { width:100%; height:34px; padding:0; border-radius:8px; border:1px solid transparent; background:transparent; position:relative; font-size:13px; }
  .cal button.day.out { color:var(--muted); opacity:.55; }
  .cal button.day.today { border-color:var(--accent); font-weight:600; }
  .cal button.day.sel { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
  .cal button.day .dot { position:absolute; left:50%; bottom:3px; width:5px; height:5px; margin-left:-2.5px; border-radius:50%; background:var(--accent); }
  .cal button.day.sel .dot { background:var(--on-accent); }
  .calhead { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .calhead button { padding:4px 10px; }
  .page { max-width:none; }
  .home { display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:18px; align-items:start; }
  @media (max-width:1000px) { .home { grid-template-columns:minmax(0,1fr); } }
  aside .card { position:sticky; top:12px; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fill, minmax(84px, 1fr)); gap:8px; margin-top:6px; }
  .tile { position:relative; display:flex; flex-direction:column; align-items:center; gap:6px; padding:12px 6px 8px; border-radius:10px; background:var(--panel); border:1px solid var(--line); min-width:0; }
  .tile:hover { border-color:var(--accent); background:var(--hover); }
  .tile img, .tile .letter { width:40px; height:40px; border-radius:8px; object-fit:contain; }
  .tile .letter { display:grid; place-items:center; background:var(--accent-bg); color:var(--chip-fg); font-weight:600; font-size:18px; }
  .tile .nm { font-size:12.5px; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tile.dragging { opacity:.4; }
  .tile.drop-before { box-shadow:-3px 0 0 0 var(--accent); }
  .tile.drop-after { box-shadow:3px 0 0 0 var(--accent); }
  .tile.add .plus { width:40px; height:40px; border-radius:8px; border:1.5px dashed var(--line-strong); display:grid; place-items:center; font-size:22px; color:var(--muted); }
  .tile .rm { position:absolute; top:2px; right:2px; width:22px; height:22px; padding:0; border-radius:50%; font-size:14px; line-height:1; color:var(--danger); background:var(--card); border:1px solid var(--line); }
  .ghead { display:flex; align-items:center; gap:6px; width:100%; text-align:left; background:transparent; border:0; padding:8px 2px 2px; margin-top:6px; font-size:11.5px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); cursor:pointer; border-radius:6px; }
  .ghead:hover { color:var(--fg); }
  .ghead .cnt { margin-left:auto; font-weight:400; }
  .ghead.droptarget, .newgroup.droptarget { outline:2px dashed var(--accent); outline-offset:1px; background:var(--hover); }
  .newgroup { display:flex; align-items:center; gap:8px; margin-top:10px; padding:10px; border:1.5px dashed var(--line-strong); border-radius:10px; font-size:12.5px; }
  .aside-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:2px; }
  .aside-head button { padding:3px 10px; font-size:12.5px; }

  /* ---- Dashboard look ---- */
  .page { padding:14px 18px 36px; }
  .hero { position:relative; display:grid; grid-template-columns:auto minmax(240px,1fr) auto auto; gap:8px 24px; align-items:center; margin-bottom:12px; padding:14px 20px; border:0; color:#fff;
    background:linear-gradient(115deg,#1f4fd8 0%,#5b3fd1 55%,#a23bc4 100%); }
  .hero::after { content:''; position:absolute; inset:0; border-radius:12px; background:radial-gradient(500px 160px at 90% 0%, rgba(255,255,255,.18), transparent 70%); pointer-events:none; }
  .hero > * { position:relative; z-index:1; }
  @media (max-width:1300px) { .hero { grid-template-columns:auto minmax(0,1fr); } .wx { grid-column:1 / -1; } }
  @media (max-width:800px) { .hero { grid-template-columns:minmax(0,1fr); } }
  .hero h1 { font-size:28px; margin:0; }
  .hero .sub { color:rgba(255,255,255,.82); margin:0 0 4px; }
  .qwrap { margin:0; text-align:center; }
  .quoteby { margin-top:4px; font-size:12.5px; color:rgba(255,255,255,.82); }
  .quote { margin:0; text-align:center; color:#fff; font-size:22px; line-height:1.3; font-style:italic; font-weight:500; text-shadow:0 1px 6px rgba(0,0,0,.25); }
  .quote::before { content:'\201C'; } .quote::after { content:'\201D'; }
  .wx { display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
  .wx-now { display:flex; align-items:center; gap:10px; }
  .wx-now .t { font-size:28px; font-weight:600; line-height:1; }
  .wx-now .d { color:rgba(255,255,255,.82); font-size:12.5px; }
  .wx-days { display:flex; gap:6px; }
  .wx-day { text-align:center; min-width:62px; padding:4px 4px; border-radius:10px; background:rgba(255,255,255,.14); }
  .wx-day .n { font-size:12px; color:rgba(255,255,255,.82); }
  .wx-day .r { font-size:12.5px; }
  .wx svg { width:28px; height:28px; display:block; margin:1px auto; }
  .wx-now svg { margin:0; width:38px; height:38px; }
  .hero .ghost { color:#fff; }
  .clock { text-align:center; color:#fff; }
  .clock svg { width:78px; height:78px; display:block; margin:0 auto; }
  .clock .dig { font-size:12.5px; color:rgba(255,255,255,.85); font-variant-numeric:tabular-nums; }
  .stats { display:flex; gap:10px; margin-bottom:12px; }
  .stats > * { flex:1 1 0; min-width:0; }
  .stats > .next { flex:2 1 0; }
  .stat-t .lb { overflow:hidden; text-overflow:ellipsis; }
  .stat-t { display:flex; align-items:center; gap:10px; padding:8px 12px; border-radius:12px; background:color-mix(in srgb, var(--c) 13%, var(--card)); border:1px solid color-mix(in srgb, var(--c) 35%, var(--line)); }
  button.stat-t { font:inherit; color:inherit; text-align:left; cursor:pointer; }
  .stat-t .num { font-size:24px; font-weight:700; color:var(--c); line-height:1; min-width:28px; }
  .stat-t .lb { font-size:12.5px; color:var(--muted); line-height:1.2; }
  .dash { display:grid; grid-template-columns:repeat(12, minmax(0,1fr)); gap:12px; align-items:stretch; margin-top:0; }
  .dash > .card, .dash > .stack { grid-column:span 6; }
  .dash > .s5 { grid-column:span 5; } .dash > .s7 { grid-column:span 7; }
  @media (max-width:1250px) { .dash > .s5, .dash > .s7 { grid-column:span 12; } }
  @media (max-width:800px) { .dash > .card, .dash > .stack { grid-column:span 12; } }
  .stack { display:flex; flex-direction:column; gap:12px; min-width:0; }
  .stack > .card { flex:1; }
  .card { padding:12px 14px; border-top:3px solid var(--c, var(--accent)); }
  .card h2 { display:flex; align-items:center; gap:8px; margin:0 0 6px; font-size:14px; }
  .card h2 .dot { width:9px; height:9px; border-radius:50%; background:var(--c, var(--accent)); flex:none; }
  .card-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:4px; }
  .card-head h2 { margin:0; }
  .card-head .count { background:color-mix(in srgb, var(--c, var(--accent)) 16%, transparent); color:var(--c, var(--accent)); border-radius:10px; padding:0 8px; font-weight:600; }
  .c-blue { --c:#2f6bf2; } .c-teal { --c:#14a38b; } .c-green { --c:#2fa24f; } .c-purple { --c:#8a4fe0; } .c-amber { --c:#e58f12; } .c-pink { --c:#d6457f; } .c-red { --c:#d9483b; } .c-orange { --c:#e8681d; }
  .task { padding:6px 4px; flex-wrap:wrap; row-gap:2px; }
  .task .title { flex:1 1 150px; min-width:0; }
  .grp { margin:8px 0 2px; font-size:11.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--c, var(--muted)); }
  .grp.over { color:var(--danger); }
  .linkrow { display:flex; align-items:center; gap:8px; width:100%; text-align:left; padding:5px 6px; border:0; background:transparent; border-radius:6px; }
  .linkrow:hover { background:var(--hover); }
  .linkrow .ar { color:var(--c, var(--accent)); }
  .linkrow.focusrow { background:color-mix(in srgb, var(--c) 12%, transparent); }
  .week { display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:6px; }
  @media (max-width:1500px) { .week { grid-template-columns:repeat(4, minmax(0,1fr)); } }
  .wk-col { background:var(--panel); border-radius:10px; padding:5px; min-height:84px; border:1px solid transparent; }
  .wk-col.today { border-color:var(--c); background:color-mix(in srgb, var(--c) 10%, var(--panel)); }
  .wk-head { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-bottom:3px; }
  .wk-col.today .wk-head { color:var(--c); font-weight:700; }
  .wk-item { font-size:12.5px; padding:2px 6px; margin-bottom:3px; border-radius:6px; background:var(--card); border-left:3px solid var(--c); overflow-wrap:anywhere; }
  .wk-item.task { border-left-color:var(--c-task, #2f6bf2); }
  .wk-item .tm { color:var(--muted); font-size:11.5px; display:block; }
  .pj { display:block; width:100%; text-align:left; padding:7px 9px; margin-bottom:6px; border-radius:10px; background:var(--panel); border:1px solid var(--line); }
  .pj:hover { border-color:var(--c); }
  .pj.focus { border-color:var(--c); }
  .pj-top { display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
  .pj .nm { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pj .meta { color:var(--muted); font-size:12px; white-space:nowrap; }
  .pj .upd { color:var(--fg); opacity:.85; font-size:12.5px; margin:3px 0 5px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .bar { height:5px; border-radius:3px; background:var(--line); overflow:hidden; }
  .bar > i { display:block; height:100%; background:var(--c); }
  .news { display:flex; gap:10px; align-items:center; width:100%; text-align:left; padding:6px 4px; border:0; border-bottom:1px solid var(--line); border-radius:0; background:transparent; }
  .news:last-child { border-bottom:0; }
  .news:hover { background:var(--hover); }
  .thumb { flex:none; width:76px; height:52px; border-radius:8px; overflow:hidden; background:linear-gradient(135deg, color-mix(in srgb, var(--c) 35%, var(--panel)), var(--panel)); }
  .thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .nt { min-width:0; }
  .nt .hl { font-weight:600; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; line-height:1.25; }
  .news .src { color:var(--muted); font-size:12px; margin-top:2px; }
  .grow { flex:1; min-width:0; }
  /* cards are about 75% solid so the page behind shows through a little */
  .card { background:color-mix(in srgb, var(--card) 75%, transparent); backdrop-filter:blur(6px); }
  .hero.card { background:linear-gradient(115deg,#1f4fd8 0%,#5b3fd1 55%,#a23bc4 100%); border-top:0; backdrop-filter:none; }
  .stat-t { background:color-mix(in srgb, color-mix(in srgb, var(--c) 13%, var(--card)) 75%, transparent); backdrop-filter:blur(6px); }
  .c-indigo { --c:#4f56d9; } .c-cyan { --c:#1b9ad6; }
  .card.outl { padding:7px 14px; }
  .card.outl .sum { gap:22px; }
  .card.outl .big { font-size:20px; }
  .mcal { display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:4px; }
  .mc-h { text-align:center; font-size:11.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); padding:2px 0; }
  .mc-day { min-height:74px; padding:3px 4px; border-radius:8px; background:color-mix(in srgb, var(--panel) 80%, transparent); border:1px solid transparent; cursor:pointer; overflow:hidden; }
  .mc-day:hover { border-color:var(--line-strong, var(--line)); }
  .mc-day.out { opacity:.45; }
  .mc-day.sel { border-color:var(--c); }
  .mc-day.today { border-color:var(--c); background:color-mix(in srgb, var(--c) 14%, var(--panel)); }
  .mc-num { display:inline-block; min-width:20px; text-align:center; font-size:12px; color:var(--muted); border-radius:10px; margin-bottom:2px; }
  .mc-day.today .mc-num { background:var(--c); color:#fff; font-weight:700; }
  .mc-ev { font-size:11.5px; line-height:1.25; margin-top:2px; padding:1px 4px; border-radius:4px; border-left:3px solid var(--c); background:color-mix(in srgb, var(--c) 14%, var(--card)); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mc-ev.task { border-left-color:#2f6bf2; background:color-mix(in srgb, #2f6bf2 10%, var(--card)); color:var(--muted); }
  .mc-more { font-size:11px; color:var(--muted); margin-top:2px; }
  .mc-detail { margin-top:8px; }
  .thumb { display:grid; place-items:center; font-size:22px; font-weight:700; color:color-mix(in srgb, var(--c) 70%, var(--fg)); }
</style>
</head>
<body>
<div id="bg" aria-hidden="true"></div>
<div class="page">
  <header class="card hero">
    <div class="hello">
      <h1 id="greeting">Welcome</h1>
      <p class="sub" id="date"></p>
    </div>
    <figure class="qwrap"><blockquote class="quote" id="quote"></blockquote><figcaption class="quoteby" id="quoteBy"></figcaption></figure>
    <div class="wx" id="weather" aria-label="Weather"></div>
    <div class="clock" id="clock" aria-hidden="true"></div>
  </header>
  <div class="home">
    <div class="main">
      <div id="focusSlot"></div>
      <div id="outlookSlot"></div>
      <div class="stats" id="stats"></div>
      <div class="dash" id="cols"></div>
      <div id="recentSlot"></div>
      <p class="muted" style="margin-top:22px;font-size:12.5px">Tasks are the ones saved in this app. Events include your linked Outlook calendar when one is set up. Mail, Teams and OneDrive stay in their own tabs.</p>
    </div>
    <aside id="appsAside" aria-label="Apps"></aside>
  </div>
</div>

<script src="common.js"></script>
<script src="sortable.js"></script>
<script>
  // Background picture chosen in Settings (kept as a copy inside the app's data folder)
  async function applyBackground() {
    const bg = document.getElementById('bg');
    let b = null;
    try { b = await window.cc.getHomeBackground(); } catch { /* no picture */ }
    if (b && b.dataUrl) {
      bg.style.backgroundImage = 'url("' + b.dataUrl + '")';
      bg.style.setProperty('--dim', String(Math.max(0, Math.min(85, Number(b.dim) || 0)) / 100));
      bg.classList.add('on');
    } else { bg.classList.remove('on'); bg.style.backgroundImage = ''; }
  }
  applyBackground();
  window.cc.onHomeBackground(() => { applyBackground(); loadRecent(false); });
  const el = (id) => document.getElementById(id);

  // A Microsoft To Do task: click the circle to tick it off in To Do
  const ticking = new Set();
  function todoRow(t) {
    const overdue = t.due && t.due < todayStr();
    const busy = ticking.has(t.title);
    const btn = h('button', {
      class: 'todo-tick', title: 'Tick off in Microsoft To Do', 'aria-label': 'Mark "' + t.title + '" done in Microsoft To Do', disabled: busy,
      style: 'width:16px;height:16px;padding:0;border:1.5px solid var(--muted);border-radius:50%;flex:none;background:' + (busy ? 'var(--muted)' : 'transparent') + ';cursor:pointer',
      onclick: async () => {
        if (ticking.has(t.title)) return;
        ticking.add(t.title); if (typeof render === 'function') render();
        let r;
        try { r = await window.cc.completeTodo(t.title); } catch { r = { ok: false, error: 'Could not tick the task.' }; }
        ticking.delete(t.title);
        if (r && r.ok) toast('Ticked off in To Do');
        else toast((r && r.error) || 'Could not tick the task.');
        if (typeof render === 'function') render();
      } });
    return h('div', { class: 'task' + (busy ? ' done' : '') },
      btn,
      h('span', { class: 'title', text: t.title }),
      h('span', { class: 'tag', title: 'Microsoft To Do', text: busy ? 'Ticking…' : 'To Do' }),
      t.due && h('span', { class: 'due' + (overdue ? ' overdue' : ''), text: (overdue ? 'Overdue · ' : '') + fmtDate(t.due) }));
  }

  function card(title, count, body, cls, action, span) {
    return h('div', { class: 'card ' + (cls || '') + (span ? ' ' + span : '') },
      h('div', { class: 'card-head' }, h('h2', {}, h('span', { class: 'dot' }), h('span', { text: title }), count != null && h('span', { class: 'count', text: String(count) })), action || null),
      body);
  }

  function evLine(ev, withDate) {
    return h('div', { class: 'ev' },
      h('span', { class: 'when', text: (withDate ? fmtDate(ev.date) + ' · ' : '') + eventTimeLabel(ev) }),
      h('span', { text: ev.title }));
  }

  // Own events, calendar-feed events and classic Outlook appointments, without doubles
  function combinedEvents() {
    const seen = new Set();
    return [...allEvents(), ...((outlook.state === 'ok' && outlook.events) || [])].filter((e) => {
      const k = [e.date, e.start || '', String(e.title || '').toLowerCase()].join('|');
      if (seen.has(k)) return false;
      seen.add(k);
      return true;
    });
  }

  function outlookCard(todayEvents) {
    if (outlook.state === 'off') return null;
    if (outlook.state === 'closed') return h('div', { class: 'card outl c-blue' }, h('div', { class: 'muted', text: 'Open Outlook on this computer to see your unread emails and appointments here.' }));
    if (outlook.state !== 'ok') return h('div', { class: 'card outl c-blue' }, h('div', { class: 'muted', text: 'Could not read Outlook just now. It will try again shortly.' }));
    const u = outlook.unread;
    const n = todayEvents.length;
    const nowHm = new Date().toTimeString().slice(0, 5);
    const next = todayEvents.find((e) => !e.allDay && e.start >= nowHm);
    return h('div', { class: 'card outl c-blue' },
      h('div', { class: 'sum' },
        h('button', { class: 'stat', onclick: () => window.cc.go('mail'), title: 'Open the Inbox tab' },

  let tasksAll = false;
  function render() {
    const now = new Date();
    const hr = now.getHours();
    el('greeting').textContent = (hr < 12 ? 'Good morning' : hr < 18 ? 'Good afternoon' : 'Good evening') + (settings.userName ? ', ' + settings.userName : '');
    el('date').textContent = now.toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    updateQuote();

    const today = todayStr();
    // Open tasks from this app plus Microsoft To Do (when it is switched on); To Do ones are read-only

    const todoOpen = (App.todo && App.todo.enabled ? (App.todo.tasks || []) : []).filter((t) => !t.done)
      .map((t) => ({ id: t.id, title: t.title, due: /^\d{4}-\d{2}-\d{2}$/.test(t.due || '') ? t.due : '', created: 0, fromTodo: true, list: t.list }));
    const tasks = [...mine, ...todoOpen];
    const evs = combinedEvents();
    const todayEvents = sortEvents(evs.filter((e) => e.date === today));
    const soon = sortEvents(evs.filter((e) => e.date > today && e.date <= addDays(today, 7)));

    el('focusSlot').replaceChildren();

    el('outlookSlot').replaceChildren(); // unread email and the next event are in the number row below the header

    renderApps();

    // Open tasks: overdue first, then by due date, undated last
    const LIMIT = 10;
    const sorted = sortTasks(tasks);
    const needs = [];
    if (sorted.length) {
      sorted.slice(0, LIMIT).forEach((t) => needs.push(t.fromTodo ? todoRow(t) : taskRow(t)));

    } else needs.push(h('div', { class: 'empty', text: 'No open tasks.' }));

    // Today: events, then anything due today (this app and To Do)
    const dueTodayTasks = sorted.filter((t) => t.due === today);
    const todayBody = [];
    if (todayEvents.length) todayBody.push(...todayEvents.map((e) => evLine(e, false)));
    if (dueTodayTasks.length) {
      if (todayEvents.length) todayBody.push(h('div', { class: 'group-title', text: 'Tasks due today' }));
      todayBody.push(...dueTodayTasks.map((t) => (t.fromTodo ? todoRow(t) : taskRow(t))));
    }
    if (!todayBody.length) todayBody.push(h('div', { class: 'empty', text: 'No events or tasks today.' }));

    // One Tasks card: overdue, today, coming up, no date
    const TL = 12;
    const bucket = { over: [], today: [], soon: [], none: [] };
    sorted.forEach((t) => bucket[!t.due ? 'none' : t.due < today ? 'over' : t.due === today ? 'today' : 'soon'].push(t));
    const trow = (t) => (t.fromTodo ? todoRow(t) : taskRow(t));

    for (const [k, label, cls] of [['over', 'Overdue', 'over'], ['today', 'Today', ''], ['soon', 'Coming up', ''], ['none', 'No date', '']]) {

  // A small analogue clock with the time under it
  function tickClock() {
    const d = new Date(), box = el('clock');
    const hr = (d.getHours() % 12) + d.getMinutes() / 60, mn = d.getMinutes() + d.getSeconds() / 60, sc = d.getSeconds();
    const hand = (deg, len, w) => '<line x1="50" y1="50" x2="' + (50 + len * Math.sin(deg * Math.PI / 180)).toFixed(1) + '" y2="' + (50 - len * Math.cos(deg * Math.PI / 180)).toFixed(1) + '" stroke-width="' + w + '" stroke-linecap="round"/>';
    let ticks = '';
    for (let i = 0; i < 12; i++) { const a = i * 30 * Math.PI / 180; ticks += '<line x1="' + (50 + 41 * Math.sin(a)).toFixed(1) + '" y1="' + (50 - 41 * Math.cos(a)).toFixed(1) + '" x2="' + (50 + 46 * Math.sin(a)).toFixed(1) + '" y2="' + (50 - 46 * Math.cos(a)).toFixed(1) + '" stroke-width="2"/>'; }
    box.innerHTML = '<svg viewBox="0 0 100 100" stroke="currentColor" fill="none">' + ticks + hand(hr * 30, 24, 3.4) + hand(mn * 6, 35, 2.4) + '<g stroke="var(--accent)">' + hand(sc * 6, 38, 1.2) + '</g></svg>'

  // Favourites and the focus project
  let roots = { projects: [], favs: [] };
  let updates = new Map(); // project id -> { file, mtime, text }
  async function loadUpdates() {
    try { const l = (await window.cc.getProjectUpdates()) || []; updates = new Map(l.map((u) => [u.id, u])); } catch { updates = new Map(); }
    render();
  }
  function focusCard() {
    const fp = App.projects.find((p) => p.id === App.data.focusProject);
    const favs = (roots.favs || []).slice(0, 8);
    const rows = [];
    if (fp) {
      const n = App.data.tasks.filter((t) => !t.done && t.project === fp.id).length;
      rows.push(h('button', { class: 'linkrow focusrow', onclick: () => window.cc.go('projects'), title: 'Open the Explorer' },
        h('span', { class: 'ar', text: '★' }), h('span', { class: 'grow', text: fp.name }), h('span', { class: 'tag accent', text: 'Focus · ' + n + (n === 1 ? ' task' : ' tasks') })));
    }
    for (const f of favs) {
      rows.push(h('button', { class: 'linkrow', title: f.rel || '', onclick: () => window.cc.navigate({ section: 'projects', project: f.root, path: f.rel || '' }) }, h('span', { class: 'ar', text: '↗' }), h('span', { class: 'grow', text: f.name })));
    }
    if (!rows.length) rows.push(h('div', { class: 'empty', text: 'Use "Make this my focus" on a project, or the star beside any folder in the Explorer, and it shows here.' }));
    return card('Focus and favourites', fp ? favs.length + 1 : favs.length, h('div', {}, rows), 'c-purple');
  }

  // Month calendar: today highlighted, your events and meetings (and tasks due) written into each day
  let monthSel = null;
  function calendarCard(evs, tasks) {
    const first = new Date(viewMonth.y, viewMonth.m, 1);
    const lead = (first.getDay() + 6) % 7; // weeks start on Monday
    const dim = new Date(viewMonth.y, viewMonth.m + 1, 0).getDate();
    const weeks = Math.ceil((lead + dim) / 7);
    const start = new Date(viewMonth.y, viewMonth.m, 1 - lead);
    const today = todayStr();
    const itemsFor = (key) => [
      ...sortEvents(evs.filter((e) => e.date === key)).map((e) => ({ kind: 'ev', e })),
      ...tasks.filter((t) => t.due === key).map((t) => ({ kind: 'task', t })),
    ];
    const cells = [];
    for (let i = 0; i < weeks * 7; i++) {
      const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
      const key = ymd(d), list = itemsFor(key);
      const chips = list.slice(0, 3).map((it) => it.kind === 'ev'
        ? h('div', { class: 'mc-ev', title: eventTimeLabel(it.e) + ' ' + it.e.title }, (it.e.allDay || !it.e.start ? '' : fmtTime(it.e.start) + ' ') + it.e.title)
        : h('div', { class: 'mc-ev task', title: 'Task: ' + it.t.title }, '☐ ' + it.t.title));
      cells.push(h('div', { class: 'mc-day' + (d.getMonth() !== viewMonth.m ? ' out' : '') + (key === today ? ' today' : '') + (key === monthSel ? ' sel' : ''), onclick: () => { monthSel = monthSel === key ? null : key; render(); } },
        h('span', { class: 'mc-num', text: String(d.getDate()) }), chips,
        list.length > 3 && h('div', { class: 'mc-more', text: '+' + (list.length - 3) + ' more' })));
    }
    const shift = (n) => { const d = new Date(viewMonth.y, viewMonth.m + n, 1); viewMonth = { y: d.getFullYear(), m: d.getMonth() }; render(); };
    const sel = monthSel ? itemsFor(monthSel) : null;
    const detail = sel && h('div', { class: 'mc-detail' },
      h('div', { class: 'grp', text: fmtDate(monthSel, { weekday: 'long', day: 'numeric', month: 'long' }) }),
      sel.length ? sel.map((it) => (it.kind === 'ev' ? evLine(it.e, false) : h('div', { class: 'ev' }, h('span', { class: 'when', text: 'Task' }), h('span', { text: it.t.title })))) : h('div', { class: 'empty', text: 'Nothing on this day.' }));
    return card(new Date(viewMonth.y, viewMonth.m, 1).toLocaleDateString('en-AU', { month: 'long', year: 'numeric' }), null,
      h('div', {}, h('div', { class: 'mcal' }, ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map((d) => h('div', { class: 'mc-h', text: d })), cells), detail || null), 'c-teal',
      h('span', {}, h('button', { class: 'ghost', 'aria-label': 'Previous month', onclick: () => shift(-1), text: '‹' }), h('button', { class: 'ghost', onclick: () => { const n = new Date(); viewMonth = { y: n.getFullYear(), m: n.getMonth() }; render(); }, text: 'Today' }), h('button', { class: 'ghost', 'aria-label': 'Next month', onclick: () => shift(1), text: '›' })));
  }

  // Week planner, Monday to Sunday (no longer shown; the month calendar replaced it)
  let weekStart = null;
  const mondayOf = (d) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
  function weekCard(evs, tasks) {
    if (!weekStart) weekStart = mondayOf(new Date());
    const today = todayStr();
    const days = [...Array(7)].map((_, i) => new Date(weekStart.getFullYear(), weekStart.getMonth(), weekStart.getDate() + i));
    const shift = (n) => { weekStart = new Date(weekStart.getFullYear(), weekStart.getMonth(), weekStart.getDate() + n * 7); render(); };
    const cols = days.map((d) => {
      const key = ymd(d);
      const e = sortEvents(evs.filter((x) => x.date === key));
      const t = tasks.filter((x) => x.due === key);
      return h('div', { class: 'wk-col' + (key === today ? ' today' : '') },
        h('div', { class: 'wk-head' }, h('span', { text: d.toLocaleDateString('en-AU', { weekday: 'short' }) }), h('span', { class: 'dn', text: String(d.getDate()) })),
        e.map((x) => h('div', { class: 'wk-item' }, h('span', { class: 'tm', text: eventTimeLabel(x) }), x.title)),
        t.map((x) => h('div', { class: 'wk-item task', title: x.fromTodo ? 'Microsoft To Do' : 'Task' }, x.title)));
    });
    const title = 'Week of ' + days[0].toLocaleDateString('en-AU', { day: 'numeric', month: 'short' });
    return card(title, null, h('div', { class: 'week' }, cols), 'c-teal',
      h('span', {}, h('button', { class: 'ghost', 'aria-label': 'Previous week', onclick: () => shift(-1), text: '‹' }), h('button', { class: 'ghost', onclick: () => { weekStart = mondayOf(new Date()); render(); }, text: 'Today' }), h('button', { class: 'ghost', 'aria-label': 'Next week', onclick: () => shift(1), text: '›' })));
  }

  // Projects: open tasks, progress, and the newest entry from the project's own memory or log file
  function projectsCard(tasks) {
    const all = App.data.tasks;
    const list = App.projects.map((p) => {
      const mine = all.filter((t) => t.project === p.id);
      return { p, open: tasks.filter((t) => t.project === p.id).length, total: mine.length, done: mine.filter((t) => t.done).length, up: updates.get(p.id) };
    }).sort((a, b) => ((b.up ? b.up.mtime : 0) - (a.up ? a.up.mtime : 0)) || (b.open - a.open) || a.p.name.localeCompare(b.p.name));
    const body = list.length
      ? h('div', {}, list.map(({ p, open, total, done, up }) => h('button', { class: 'pj' + (p.id === App.data.focusProject ? ' focus' : ''), onclick: () => window.cc.go('projects'), title: up ? 'From ' + up.file : 'Open the Explorer' },
          h('div', { class: 'pj-top' }, h('span', { class: 'nm', text: p.name }), h('span', { class: 'meta', text: open + (open === 1 ? ' open task' : ' open tasks') + (up ? ' · updated ' + whenLabel(up.mtime) : '') })),
          up && up.text && h('div', { class: 'upd', text: up.text }),
          total ? h('div', { class: 'bar', role: 'img', 'aria-label': done + ' of ' + total + ' done' }, h('i', { style: 'width:' + Math.round(done / total * 100) + '%' })) : null)))
      : h('div', { class: 'empty', text: 'No project updates yet. Notes appear here from each project folder’s memory or log file (for example 08_Memory or MEMORY.md).' });
    return card('Current Projects', list.length || null, body, 'c-green');
  }

  // News and financial news, with a small picture where the feed has one
  const imgData = new Map();
  function thumb(item) {
    const box = h('div', { class: 'thumb', text: (item.source || '?').charAt(0).toUpperCase() });
    if (!item.image) return box;
    const put = (d) => { if (d) { const im = document.createElement('img'); im.alt = ''; im.src = d; box.replaceChildren(im); } };
    if (imgData.has(item.image)) put(imgData.get(item.image));
    else if (!imgData.has('p:' + item.image)) {
      imgData.set('p:' + item.image, true);
      window.cc.getImage(item.image).then((d) => { imgData.set(item.image, d || null); document.querySelectorAll('.thumb[data-u="' + CSS.escape(item.image) + '"]').forEach((b) => { if (d) { const im = document.createElement('img'); im.alt = ''; im.src = d; b.replaceChildren(im); } }); }).catch(() => imgData.set(item.image, null));
    }
    box.dataset.u = item.image;
    return box;
  }
  const NEWS = { news: { state: 'loading', items: [] }, finance: { state: 'loading', items: [] }, music: { state: 'loading', items: [] }, gigs: { state: 'loading', items: [] } };
  async function loadNews(force) {
    for (const k of ['news', 'finance', 'music', 'gigs']) {
      let r = null;
      try { r = await window.cc.getFeed(k, !!force); } catch { /* shown as unavailable */ }
      NEWS[k] = !r ? { state: 'error', items: [] } : r.off ? { state: 'off', items: [] } : { state: r.ok ? 'ok' : 'error', items: r.items || [] };
    }
    render();
  }
  function newsCard(kind, title, cls) {
    const n = NEWS[kind];
    if (n.state === 'off') return null;
    let body;
    if (n.state === 'loading') body = h('div', { class: 'empty', text: 'Loading headlines…' });
    else if (n.state === 'error') body = h('div', {}, h('div', { class: 'empty', text: 'Headlines are not available just now.' }), h('button', { class: 'ghost', onclick: () => loadNews(true), text: 'Try again' }));
    else body = h('div', {}, n.items.slice(0, 5).map((it) => h('button', { class: 'news', title: 'Open in your browser', onclick: () => window.cc.openNews(it.link) },
      thumb(it), h('div', { class: 'nt' }, h('div', { class: 'hl', text: it.title }), h('div', { class: 'src', text: it.source + (it.when ? ' · ' + whenLabel(it.when) : '') })))));
    return card(title, null, body, cls, h('span', {}, kind === 'gigs' && h('button', { class: 'ghost', onclick: () => window.cc.openNews('https://beat.com.au/gig-guide/'), text: 'Full gig guide' }), h('button', { class: 'ghost', onclick: () => loadNews(true), text: 'Refresh' })));
  }

  // ---- Pick up where you left off ----
  let recent = { state: 'loading', items: [], filter: 'all', all: false, note: null };
  const KINDS = [['all', 'All'], ['doc', 'Documents'], ['xls', 'Spreadsheets'], ['pdf', 'PDFs'], ['dir', 'Folders']];
  const EXT = { doc: ['.doc', '.docx', '.docm', '.rtf', '.txt', '.md', '.odt'], xls: ['.xls', '.xlsx', '.xlsm', '.csv', '.ods'], pdf: ['.pdf'], ppt: ['.ppt', '.pptx', '.odp'] };
  function kindOf(it) {
    if (it.isFolder) return 'dir';
    for (const k of Object.keys(EXT)) if (EXT[k].includes(it.ext)) return k;
    return 'oth';
  }
  const BADGE = { doc: 'DOC', xls: 'XLS', pdf: 'PDF', dir: '▤', ppt: 'PPT' };
  function whenLabel(ms) {
    const d = new Date(ms), now = new Date(), diff = now - d;
    const hm = d.toLocaleTimeString('en-AU', { hour: 'numeric', minute: '2-digit' });
    if (diff < 60000) return 'just now';
    if (diff < 3600000) return Math.floor(diff / 60000) + 'm ago';
    if (d.toDateString() === now.toDateString()) return Math.floor(diff / 3600000) + 'h ago';
    const y = new Date(now); y.setDate(y.getDate() - 1);
    if (d.toDateString() === y.toDateString()) return 'yesterday at ' + hm;
    return d.toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: d.getFullYear() === now.getFullYear() ? undefined : 'numeric' });
  }
  async function loadRecent(force) {
    let r = null;
    try { r = await window.cc.getRecent(!!force); } catch { /* shown as unavailable */ }
    if (!r) recent.state = 'error';
    else if (r.disabled) recent.state = 'off';
    else if (r.unsupported) recent.state = 'unsupported';
    else { recent.state = r.ok ? 'ok' : (r.items && r.items.length ? 'ok' : 'error'); recent.items = r.items || []; }
    renderRecent();
  }
  async function openRecent(it, reveal) {
    const r = await window.cc.openRecent(it.id, reveal);
    recent.note = r && r.ok ? null : { text: (r && r.error) || 'Could not open that.' };
    if (recent.note) renderRecent();
  }
  function renderRecent() {
    const slot = el('recentSlot');
    if (recent.state === 'off' || recent.state === 'loading') { slot.replaceChildren(); return; }
    if (recent.state === 'unsupported') { slot.replaceChildren(card('Pick up where you left off', null, h('div', { class: 'empty', text: 'Your recent files appear here on Windows.' }))); return; }
    if (recent.state === 'error') { slot.replaceChildren(card('Pick up where you left off', null, h('div', { class: 'empty', text: 'Could not read your recent files just now. It will try again shortly.' }))); return; }
    const kinds = new Set(recent.items.map(kindOf));
    const chips = KINDS.filter(([k]) => k === 'all' || kinds.has(k));
    if (!chips.some(([k]) => k === recent.filter)) recent.filter = 'all';
    const list = recent.items.filter((it) => recent.filter === 'all' || kindOf(it) === recent.filter);
    const shown = recent.all ? list : list.slice(0, 8);
    const rows = shown.map((it) => {
      const k = kindOf(it);
      return h('div', { class: 'rc-line' },
        h('button', { class: 'rc-row', onclick: () => openRecent(it, false), title: 'Open ' + it.name + '\n' + it.folder, 'aria-label': 'Open ' + it.name + ', ' + whenLabel(it.when) },
          h('span', { class: 'rc-badge ' + k, 'aria-hidden': 'true', text: BADGE[k] || (it.ext ? it.ext.slice(1, 4).toUpperCase() : 'FILE') }),
          h('span', { class: 'rc-main' }, h('div', { class: 'rc-name', text: it.name }), h('div', { class: 'rc-path' }, h('bdi', { text: it.folder }))),
          h('span', { class: 'rc-when', text: whenLabel(it.when) })),
        h('button', { class: 'ghost rc-show', onclick: () => openRecent(it, true), title: 'Show in its folder', 'aria-label': 'Show ' + it.name + ' in its folder', text: 'Show in folder' }));
    });
    slot.replaceChildren(h('div', { class: 'card' },
      h('div', { class: 'rc-head' }, h('h2', { text: 'Pick up where you left off' }),
        h('div', { class: 'chips', role: 'group', 'aria-label': 'Filter' }, chips.map(([k, l]) => h('button', { class: 'chip', 'aria-pressed': String(recent.filter === k), onclick: () => { recent.filter = k; recent.all = false; renderRecent(); }, text: l })))),
      rows.length ? h('div', {}, rows) : h('div', { class: 'empty', text: recent.items.length ? 'Nothing of this kind in your recent files.' : 'Nothing opened lately. Files you open in Word, Excel, PDF viewers and File Explorer show up here.' }),
      list.length > 8 && h('button', { class: 'ghost rc-more', onclick: () => { recent.all = !recent.all; renderRecent(); }, text: recent.all ? 'Show fewer' : 'Show ' + (list.length - 8) + ' more' }),
      recent.note && h('div', { class: 'msg err', role: 'alert', style: 'margin-top:8px;color:var(--danger)', text: recent.note.text })));
  }

  let settings = { userName: '' };
  let apps = [];
  let icons = {};
  let editing = false;
  let outlook = { state: 'off' };
  let selDay = todayStr();
  let viewMonth = { y: new Date().getFullYear(), m: new Date().getMonth() };
  const loadOutlook = (force) => (window.cc.getOutlook ? window.cc.getOutlook(force) : Promise.resolve({ state: 'off' }))
    .then((o) => { outlook = o || { state: 'off' }; render(); }).catch(() => {});
  Promise.all([window.cc.getSettings(), window.cc.getRoots()]).then(async ([s, r]) => {
    settings = s || settings;
    apps = (r && r.apps) || [];
    icons = (window.cc.appIcons && (await window.cc.appIcons())) || {};
    roots = { projects: (r && r.projects) || [], favs: (r && r.favs) || [] };
    App.init(render);
    loadOutlook(false);
    loadWeather(false);
    loadNews(false);
    loadUpdates();
  });
  tickClock(); setInterval(tickClock, 1000);
  updateQuote(); setInterval(updateQuote, 30000);
  const reloadRoots = () => window.cc.getRoots().then((r) => { roots = { projects: (r && r.projects) || [], favs: (r && r.favs) || [] }; render(); }).catch(() => {});
  if (window.cc.onFavsChanged) window.cc.onFavsChanged(reloadRoots);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) reloadRoots(); });
  setInterval(() => { loadWeather(false); loadNews(false); loadUpdates(); }, 15 * 60000);
  setInterval(() => loadOutlook(false), 120000);
  window.addEventListener('focus', () => { reloadApps(); loadOutlook(false); loadRecent(true); loadWeather(false); window.cc.getRoots().then((r) => { roots = { projects: (r && r.projects) || [], favs: (r && r.favs) || [] }; render(); }).catch(() => {}); loadUpdates(); });
  setInterval(() => loadRecent(false), 60000);
  loadRecent(true);
</script>
