<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Browser</title>
<link rel="stylesheet" href="shared.css">
<style>
  /* Toolbar height (tab strip 36 + address row 44) must equal TOOLBAR_H in browser.js */
  html, body { overflow:hidden; }
  .bar { height:80px; display:flex; flex-direction:column; background:var(--panel); border-bottom:1px solid var(--line); }
  .tabs { height:36px; display:flex; align-items:flex-end; gap:2px; padding:4px 8px 0; overflow:hidden; }
  .tab { display:flex; align-items:center; gap:6px; min-width:0; flex:0 1 200px; height:32px; padding:0 6px 0 12px; border:1px solid transparent; border-bottom:0; border-radius:8px 8px 0 0; background:transparent; color:var(--muted); cursor:pointer; }
  .tab:hover { background:var(--hover); }
  .tab.on { background:var(--bg); border-color:var(--line); color:var(--fg); }
  .tab .t { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:left; font-size:13px; }
  .tab .x { border:0; background:transparent; color:inherit; padding:0 6px; border-radius:6px; font-size:15px; line-height:22px; cursor:pointer; }
  .tab .x:hover { background:var(--panel); color:var(--danger); }
  .tab .spin { width:10px; height:10px; border:2px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:sp .8s linear infinite; flex:none; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .plus { height:28px; width:28px; padding:0; margin:0 0 2px 4px; border-radius:8px; font-size:18px; line-height:1; }
  .addr { height:44px; display:flex; align-items:center; gap:6px; padding:0 10px; background:var(--bg); }
  .addr button { padding:0; width:32px; height:32px; font-size:16px; line-height:1; flex:none; }
  .addr input { flex:1; min-width:0; height:32px; border-radius:16px; padding:0 14px; }
  /* sits over the address row so the page below never covers it */
  .clear { position:fixed; top:36px; left:0; right:0; height:44px; z-index:2; display:none; gap:10px; align-items:center; justify-content:center; background:var(--card); border-bottom:1px solid var(--line); padding:0 12px; }
  .clear button { padding:5px 14px; }
  .clear.show { display:flex; }
</style>
</head>
<body>
<div class="bar">
  <div class="tabs" id="tabs" role="tablist" aria-label="Browser tabs"></div>
  <form class="addr" id="form" autocomplete="off">
    <button type="button" id="back" title="Back (Alt+Left)" aria-label="Back">&#8592;</button>
    <button type="button" id="fwd" title="Forward (Alt+Right)" aria-label="Forward">&#8594;</button>
    <button type="button" id="rel" title="Reload (F5)" aria-label="Reload">&#8635;</button>
    <input type="text" id="url" list="sugg" spellcheck="false" aria-label="Address or search" placeholder="Search or type a web address">
    <datalist id="sugg"></datalist>
    <button type="button" id="more" title="Clear browsing data" aria-label="Clear browsing data">&#8943;</button>
  </form>
</div>
<div class="clear" id="clear" role="alertdialog" aria-label="Clear browsing data">
  <span>Clear history, sign-ins and cached files for this browser?</span>
  <button type="button" class="primary" id="clearYes">Clear</button>
  <button type="button" id="clearNo">Cancel</button>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  let st = { activeId: null, tabs: [] };
  let lastActive = null;

  function render() {
    const tabs = $('tabs');
    tabs.replaceChildren();
    for (const t of st.tabs) {
      const el = document.createElement('div');
      el.className = 'tab' + (t.id === st.activeId ? ' on' : '');
      el.setAttribute('role', 'tab');
      el.setAttribute('aria-selected', String(t.id === st.activeId));
      el.title = t.title;
      if (t.loading) { const s = document.createElement('span'); s.className = 'spin'; el.append(s); }
      const label = document.createElement('span'); label.className = 't'; label.textContent = t.title;
      const x = document.createElement('button'); x.className = 'x'; x.type = 'button'; x.textContent = '×'; x.setAttribute('aria-label', 'Close tab ' + t.title);
      x.addEventListener('click', (e) => { e.stopPropagation(); window.tb.closeTab(t.id); });
      el.addEventListener('click', () => window.tb.selectTab(t.id));
      el.addEventListener('auxclick', (e) => { if (e.button === 1) window.tb.closeTab(t.id); });
      el.append(label, x);
      tabs.append(el);
    }
    const plus = document.createElement('button'); plus.className = 'plus ghost'; plus.type = 'button'; plus.textContent = '+'; plus.title = 'New tab (Ctrl+T)'; plus.setAttribute('aria-label', 'New tab');
    plus.addEventListener('click', () => window.tb.newTab());
    tabs.append(plus);

    const a = st.tabs.find((t) => t.id === st.activeId);
    $('back').disabled = !a || !a.canBack;
    $('fwd').disabled = !a || !a.canForward;
    $('rel').textContent = a && a.loading ? '×' : '↻';
    $('rel').title = a && a.loading ? 'Stop' : 'Reload (F5)';
    $('rel').setAttribute('aria-label', a && a.loading ? 'Stop' : 'Reload');
    const input = $('url');
    if (a && (document.activeElement !== input || st.activeId !== lastActive)) input.value = a.url;
    lastActive = st.activeId;
  }

  window.tb.onState((s) => { st = s; render(); });
  window.tb.state().then((s) => { if (s) { st = s; render(); } });
  window.tb.onFocusAddress(() => { $('url').focus(); $('url').select(); });

  $('form').addEventListener('submit', (e) => { e.preventDefault(); window.tb.go($('url').value); $('url').blur(); });
  $('back').addEventListener('click', () => window.tb.back());
  $('fwd').addEventListener('click', () => window.tb.forward());
  $('rel').addEventListener('click', () => { const a = st.tabs.find((t) => t.id === st.activeId); if (a && a.loading) window.tb.stop(); else window.tb.reload(); });
  $('url').addEventListener('focus', () => $('url').select());
  $('url').addEventListener('input', async () => {
    const list = await window.tb.suggest($('url').value);
    $('sugg').replaceChildren(...(list || []).map((s) => { const o = document.createElement('option'); o.value = s.url; o.label = s.title; return o; }));
  });
  $('more').addEventListener('click', () => $('clear').classList.toggle('show'));
  $('clearNo').addEventListener('click', () => $('clear').classList.remove('show'));
  $('clearYes').addEventListener('click', async () => { await window.tb.clearData(); $('clear').classList.remove('show'); });
</script>
</body>
</html>
