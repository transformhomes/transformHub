<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Tasks</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div class="page">
  <h1>Tasks</h1>
  <p class="sub">Saved on this laptop. Tick to complete, × to delete (with undo).</p>

  <form id="add" class="row" autocomplete="off">
    <input id="title" class="grow" type="text" maxlength="500" placeholder="Add a task and press Enter" aria-label="New task">
    <span id="projSlot"></span>
    <input id="due" type="date" aria-label="Due date">
    <button class="primary" type="submit">Add</button>
  </form>

  <div class="row" style="margin-top:16px">
    <button class="ghost" data-f="active">Active</button>
    <button class="ghost" data-f="done">Done</button>
    <button class="ghost" data-f="all">All</button>
    <span class="grow"></span>
    <span id="filterSlot"></span>
  </div>

  <div id="list"></div>
  <div id="todoBox"></div>
</div>

<script src="common.js"></script>
<script>
  let filter = 'active';
  let projectFilter = '';
  let formProj;
  let filterSel;

  function setup() {
    formProj = projectSelect('', false);
    document.getElementById('projSlot').append(formProj);
    filterSel = projectSelect('', true);
    filterSel.addEventListener('change', () => { projectFilter = filterSel.value; render(); });
    document.getElementById('filterSlot').append(filterSel);

    document.getElementById('add').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('title');
      const due = document.getElementById('due');
      if (!title.value.trim()) { title.focus(); return; }
      await addTask(title.value, formProj.value, due.value);
      title.value = '';
      due.value = ''; // don't let the next task silently inherit this date
      title.focus();
    });
    document.querySelectorAll('[data-f]').forEach((b) =>
      b.addEventListener('click', () => { filter = b.dataset.f; render(); }));
  }


  function todoStatusText(td) {
    const when = td.updated ? new Date(td.updated).toLocaleTimeString('en-AU', { hour: 'numeric', minute: '2-digit' }) : null;
    if (td.status === 'ok') return 'Updated ' + when + ' (read-only)';
    if (td.status === 'signin') return 'Not signed in to Microsoft. Open the Inbox tab, sign in, then refresh.';
    if (td.status === 'unreadable') return 'Could not read the To Do page (its layout may have changed).' + (when ? ' Showing tasks from ' + when + '.' : '');
    if (td.status === 'error') return 'Could not refresh.' + (when ? ' Showing tasks from ' + when + '.' : '');
    return 'Not synced yet.';
  }

  function renderTodo() {
    const box = document.getElementById('todoBox');
    box.replaceChildren();
    const td = App.todo;
    if (!td || !td.enabled) return;
    const open = td.tasks.filter((x) => !x.done);
    box.append(h('div', { class: 'group-title', text: 'Microsoft To Do (' + open.length + ')' }));
    box.append(h('div', { class: 'row', style: 'margin:4px 0 8px' },
      h('span', { class: 'muted', text: todoStatusText(td) }),
      h('button', { class: 'ghost', id: 'todoRefresh', text: 'Refresh', onclick: async (e) => { e.target.disabled = true; e.target.textContent = 'Refreshing…'; await window.cc.refreshTodo(); } })));
    open.slice(0, 100).forEach((x) => box.append(h('div', { class: 'task' },
      h('span', { class: 'ico-todo', 'aria-hidden': 'true', style: 'width:15px;height:15px;border:1.5px solid var(--muted);border-radius:50%;flex:none' }),
      h('span', { class: 'title', text: x.title }),
      h('span', { class: 'tag', text: x.list }))));
    if (!open.length && td.status === 'ok') box.append(h('div', { class: 'empty', text: 'No open To Do tasks.' }));
    if (td.status === 'unreadable' || (td.status !== 'ok' && td.diag && td.diag.length)) {
      box.append(h('details', { style: 'margin-top:10px' }, h('summary', { class: 'muted', text: 'Diagnostic (no task text)' }),
        h('pre', { style: 'white-space:pre;overflow:auto;max-height:420px;user-select:text;font-size:11.5px', text: td.diag.map((d) => JSON.stringify({ ...d, outline: undefined })  + (d.outline && d.outline.length ? '\\n' + d.outline.join('\\n') : '')).join('\\n\\n') })));
    }
  }

  function group(title, tasks, out) {
    if (!tasks.length) return;
    out.append(h('div', { class: 'group-title', text: title + ' (' + tasks.length + ')' }));
    sortTasks(tasks).forEach((t) => out.append(taskRow(t)));
  }

  function render() {
    document.querySelectorAll('[data-f]').forEach((b) => {
      b.style.color = b.dataset.f === filter ? 'var(--accent)' : '';
    });
    const list = document.getElementById('list');
    list.replaceChildren();

    let tasks = App.data.tasks.filter((t) => !projectFilter || t.project === projectFilter);
    const today = todayStr();
    const active = tasks.filter((t) => !t.done);
    const done = tasks.filter((t) => t.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));

    if (filter !== 'done') {
      group('Overdue', active.filter((t) => t.due && t.due < today), list);
      group('Today', active.filter((t) => t.due === today), list);
      group('Upcoming', active.filter((t) => t.due && t.due > today), list);
      group('No date', active.filter((t) => !t.due), list);
    }
    if (filter !== 'active') {
      if (done.length) {
        list.append(h('div', { class: 'group-title', text: 'Done (' + done.length + ')' }));
        done.forEach((t) => list.append(taskRow(t)));
      }
    }
    if (!list.children.length) {
      list.append(h('div', { class: 'empty', text: filter === 'done' ? 'Nothing completed yet.' : 'No tasks here. Add one above.' }));
    }
    renderTodo();
  }

  App.init(() => { if (!formProj) setup(); render(); });
</script>
</body>
</html>
